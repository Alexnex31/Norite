name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be >= the highest `go` directive in the workspace, which is what actually pins this. The floor has
  # been raised twice by a dependency rather than by choice: testcontainers-go took it to 1.25.0, and
  # golang.org/x/crypto v0.56.0 — the first release fixing GO-2026-6354/6355 — took it to 1.26.0.
  GO_VERSION: "1.26"
  # Keep in sync with `sqlc_version` in the justfile.
  SQLC_VERSION: "v1.30.0"
  # Keep in sync with `oapi_codegen_version` in the justfile. Pinned for the same reason as the other two:
  # an unpinned generator turns an upstream release into a surprise failure on an unrelated PR.
  OAPI_CODEGEN_VERSION: "v2.8.0"
  # Keep in sync with `golangci_lint_version` in the justfile.
  #
  # Pinned, not `latest`: an unpinned linter turns an upstream release into a surprise CI failure on an
  # unrelated PR. It must also be built with Go >= the highest `go` directive in the workspace (1.25.0) —
  # golangci-lint v1's final release is built with Go 1.24 and refuses to run, which is what broke M1's
  # first CI run. v2 needs golangci-lint-action v7+; v6 drives v1 only.
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli, gui, daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Glob rather than ${{ matrix.module }}/go.sum: gui still has zero dependencies and so no
          # go.sum, and setup-go fails on a path that matches nothing. (daemon grew one at M3.)
          cache-dependency-path: "**/go.sum"
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli, gui, daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Glob rather than ${{ matrix.module }}/go.sum: gui still has zero dependencies and so no
          # go.sum, and setup-go fails on a path that matches nothing. (daemon grew one at M3.)
          cache-dependency-path: "**/go.sum"
      # The backend's integration tests start a real Postgres via testcontainers. ubuntu-latest runners
      # ship a working Docker daemon, so no extra service container or setup step is needed.
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -count=1

      # go.work resolves cross-module imports from the checkout, so a module whose own go.mod and go.sum
      # are missing an entry still builds here. That was harmless while the four modules were independent
      # and stopped being so at M7, when cli began requiring daemon: a dependency added to daemon is
      # invisible from cli until something builds without the workspace, which is what a release build and
      # anyone consuming a single module actually do. This is the cheapest place to notice.
      - name: go build without the workspace
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go build ./...

      # The backend must never link a copyleft dependency, and go.mau.fi/libsignal (GPL-3.0) is the one
      # the design actually calls for — in the daemon, at M97, never here. Rule 22 and ADR 0032 give the
      # reason: the daemon is permanently copyleft-locked once it lands, while the backend stays
      # relicensable for exactly as long as it is copyleft-free.
      #
      # `just license-check`'s per-module policy already denies it, but that check reads the module graph.
      # This reads the linked binary, which is the only thing that can answer whether a *transitive* path
      # dragged it in — and a transitive path is how it would actually happen, silently, years from now.
      # It holds today by construction because the linker keeps only what is reachable, which is precisely
      # why it needs an assertion: there is nothing to see in a diff when it breaks.
      - name: the backend links no copyleft dependency
        if: matrix.module == 'backend'
        # working-directory like every other step in this job: the matrix runs from the repository root,
        # where there is no go.mod, so `go build ./cmd/server` cannot resolve a module without it.
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: |
          go build -o /tmp/norite-server ./cmd/server
          if go version -m /tmp/norite-server | grep -qi 'libsignal'; then
            echo "::error::the server binary links libsignal — see CLAUDE.md rule 22 and docs/adr/0032-agpl-license.md"
            go version -m /tmp/norite-server | grep -i libsignal
            exit 1
          fi
          echo "no libsignal in the server binary"

  codegen:
    name: codegen is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      # sqlc output is committed so a plain `go build` needs no extra tooling. That only stays true if a
      # schema or query change can't merge without its regenerated code, which is what this checks.
      - name: sqlc generate
        working-directory: backend
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }} generate
      - name: fail if the committed output is stale
        run: |
          if ! git diff --quiet -- backend/internal/db; then
            echo "::error::backend/internal/db is out of date — run 'just sqlc-generate' and commit the result"
            git --no-pager diff -- backend/internal/db
            exit 1
          fi
      # The contract types are committed for the reason the sqlc output is, and checked here for the same
      # reason: rule 6 requires a new endpoint to update contracts/openapi.yaml in the same commit, and
      # this is what makes "the backend agrees with the document" a build failure rather than a habit.
      - name: oapi-codegen generate
        working-directory: backend
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${{ env.OAPI_CODEGEN_VERSION }} \
            -config oapi-codegen.yaml ../contracts/openapi.yaml
      - name: fail if the committed contract types are stale
        run: |
          if ! git diff --quiet -- backend/internal/apicontract; then
            echo "::error::backend/internal/apicontract is out of date — run 'just contract-generate' and commit the result"
            git --no-pager diff -- backend/internal/apicontract
            exit 1
          fi
      # The dependency-license inventory is committed for the same reason the sqlc output is: a change to
      # the set of licenses this project ships under should arrive in a diff somebody reads, rather than
      # being a thing anyone could have checked. Regenerated here and compared, so adding a dependency
      # without recording its license cannot merge.
      - name: install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: license inventory
        # The same thing `just license-inventory` does, inlined rather than installing `just` in CI: no
        # other job here needs it, and pulling an install script over the network to run one recipe adds a
        # supply-chain dependency to the critical path for no benefit. The duplication is safe because it
        # is self-detecting — the committed file is generated by the justfile, this regenerates it, and any
        # drift between the two shows up as this step failing rather than as a silent disagreement.
        #
        # LC_ALL=C because sort collation is locale-dependent and this runner's locale is not the
        # maintainer's: the first run of this step failed on ordering alone, same lines, different order.
        run: |
          out=contracts/dependency-licenses.txt
          {
            echo '# Dependency licenses, every Go module, generated by `just license-inventory`.'
            echo '# The allow-list and the reasoning are in docs/adr/0032-agpl-license.md.'
            echo '# module,license-url,license'
          } > "$out"
          for m in backend cli gui daemon; do
            (cd "$m" && GOWORK=off go-licenses report ./... \
              --ignore github.com/Alexnex31/Norite 2>/dev/null) || true
          done | LC_ALL=C sort -u >> "$out"
      - name: fail if the committed inventory is stale
        run: |
          if ! git diff --quiet -- contracts/dependency-licenses.txt; then
            echo "::error::contracts/dependency-licenses.txt is out of date — run 'just license-inventory' and commit the result"
            git --no-pager diff -- contracts/dependency-licenses.txt
            exit 1
          fi
      - name: denied license identifiers
        # The layer --disallowed_types cannot express. go-licenses classifies by type, and GPL-2.0 and
        # GPL-3.0 both land in `restricted` — so allowing `restricted` for the clients admits both, while
        # only GPL-2.0-or-later actually combines with AGPL-3.0. Matched on the SPDX identifier instead,
        # anchored with -x so GPL-2.0-or-later is not caught by a GPL-2.0 prefix. Runs against the file
        # just regenerated above, so it cannot pass on a stale inventory.
        run: |
          denied=$(tail -n +4 contracts/dependency-licenses.txt | cut -d, -f3 \
            | grep -Ex 'GPL-2\.0-only|GPL-1\.0.*|SSPL.*|BUSL.*|Elastic-2\.0|CC-BY-SA.*' | sort -u || true)
          if [ -n "$denied" ]; then
            echo "::error::dependency license identifier outside the allow-list — see docs/adr/0032-agpl-license.md"
            echo "$denied"
            exit 1
          fi
          echo "no denied SPDX identifier in the inventory"
      - name: third-party notices
        # Regenerated from the built binaries, not the module graph: the linker is the only authority on
        # what actually ships, and `./...` would sweep in testcontainers and its Docker set — test-only
        # code that is never distributed and must not appear in a notice describing a shipped binary.
        # Committed for the reason the inventory is, and checked here so a new dependency cannot merge
        # without its attribution.
        run: |
          mkdir -p bin
          (cd backend && GOWORK=off go build -o ../bin/norite-server ./cmd/server)
          (cd cli     && GOWORK=off go build -o ../bin/norite        ./cmd/app)
          (cd gui     && GOWORK=off go build -o ../bin/norite-gui    ./cmd/gui)
          (cd daemon  && GOWORK=off go build -o ../bin/norite-daemon ./cmd/daemond)
          ./scripts/gen-third-party-notices.sh backend ./cmd/server  bin/norite-server backend/internal/notices/THIRD-PARTY-NOTICES.txt
          ./scripts/gen-third-party-notices.sh cli     ./cmd/app     bin/norite        cli/internal/notices/THIRD-PARTY-NOTICES.txt
          ./scripts/gen-third-party-notices.sh gui     ./cmd/gui     bin/norite-gui    gui/internal/notices/THIRD-PARTY-NOTICES.txt
          ./scripts/gen-third-party-notices.sh daemon  ./cmd/daemond bin/norite-daemon daemon/internal/notices/THIRD-PARTY-NOTICES.txt
      - name: every hand-written Go file carries its SPDX header
        # Rule 24. Nothing else enforces it: the pass that added the headers was one-off, so what this
        # catches is the next file, written by somebody who has not read the rule — which is the only way
        # the rule was going to decay.
        #
        # The same logic as `just spdx-check`, inlined for the reason the inventory generator is: no job
        # here installs `just`, and pulling an install script over the network to run one recipe adds a
        # supply-chain dependency to the critical path for no benefit. Safe to duplicate because both read
        # the same tree and a disagreement shows up as this step failing, not as a silent divergence.
        #
        # Generated files are matched on Go's own convention rather than the loose phrase: `grep -q "Code
        # generated"` over a whole file would also skip a hand-written file that merely mentions it, and
        # skipping is how this fails silently instead of loudly.
        run: |
          fail=0
          for f in $(git ls-files '*.go'); do
            if head -5 "$f" | grep -qE '^// Code generated .* DO NOT EDIT\.$'; then
              if head -2 "$f" | grep -q 'SPDX-'; then
                echo "::error file=$f::generated file carries an SPDX header; it will be lost on regeneration"
                fail=1
              fi
              continue
            fi
            head -2 "$f" | grep -q '^// SPDX-FileCopyrightText: ' || {
              echo "::error file=$f::missing '// SPDX-FileCopyrightText: <year> <holder>' on line 1 (rule 24)"; fail=1; }
            head -2 "$f" | grep -q '^// SPDX-License-Identifier: AGPL-3.0-or-later$' || {
              echo "::error file=$f::missing '// SPDX-License-Identifier: AGPL-3.0-or-later' on line 2 (rule 24)"; fail=1; }
            [ -z "$(sed -n '3p' "$f")" ] || {
              echo "::error file=$f::line 3 must be blank — a package comment otherwise renders as the license, and a //go:build constraint lands inside the header's comment block"; fail=1; }
          done
          if git grep -n 'SPDX-License-Identifier: AGPL-3.0$' -- '*.go'; then
            echo "::error::the bare AGPL-3.0 identifier is deprecated — use AGPL-3.0-or-later"
            fail=1
          fi
          for f in $(git ls-files '*.sql' '*.md' '*.yml' '*.yaml' '*.toml'); do
            if head -2 "$f" | grep -q '^\(#\|--\|//\) *SPDX-'; then
              echo "::error file=$f::only .go files carry SPDX headers; LICENSE covers the rest (ADR 0032)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "every hand-written Go file carries its SPDX header"
          exit $fail

      - name: fail if the committed notices are stale
        run: |
          if ! git diff --quiet -- '*/internal/notices/THIRD-PARTY-NOTICES.txt'; then
            echo "::error::a THIRD-PARTY-NOTICES.txt is out of date — run 'just notices' and commit the result"
            git --no-pager diff --stat -- '*/internal/notices/THIRD-PARTY-NOTICES.txt'
            exit 1
          fi

  security:
    name: security (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli, gui, daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Glob for the reason the lint job gives: gui has no go.sum, and setup-go fails on a path that
          # matches nothing.
          cache-dependency-path: "**/go.sum"
      - name: install govulncheck
        # Unpinned, unlike sqlc and golangci-lint above, and for a reason that does not apply to them.
        # Pinning those stops an upstream release turning into a surprise failure on an unrelated PR.
        # Here the surprise is the product: what fails this job is a new advisory against a dependency
        # this repository already has, fetched from the vulnerability database at run time — so pinning
        # the binary would not prevent it and would only delay picking up scanner fixes.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: install go-licenses
        # Unpinned for the same reason as govulncheck above: what fails this step is a dependency's license,
        # not the scanner's version.
        run: go install github.com/google/go-licenses@latest
      - name: dependency licenses
        working-directory: ${{ matrix.module }}
        # GOWORK=off because go-licenses drives the go tool with flags the workspace refuses; --ignore our
        # own path because go-licenses stops looking for a LICENSE at the module root and this repository's
        # is one level above it, so every first-party package would report Unknown. The allow-list and the
        # reasoning are in docs/adr/0032-agpl-license.md.
        #
        # The policy splits by module (ADR 0032): backend/ keeps the strict set because its value in that
        # split is staying trivially relicensable, while the clients drop `restricted` (which admits
        # GPL-3.0, i.e. libsignal at M97) and `reciprocal` (MPL-2.0). Kept as a case rather than a matrix
        # input so it reads the same way as the justfile's copy; the two must not drift.
        run: |
          case "${{ matrix.module }}" in
            backend) types=forbidden,restricted,reciprocal ;;
            *)       types=forbidden ;;
          esac
          echo "denying: $types"
          GOWORK=off go-licenses check ./... \
            --ignore github.com/Alexnex31/Norite \
            --disallowed_types="$types"
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        # The same command `just security-scan` runs, per module, so the local and CI answers cannot
        # disagree. Blocking rather than advisory: architecture.md §10 says this runs on every PR, and a
        # security job somebody has learned to scroll past is worth less than no job at all.
        run: govulncheck ./...

  build:
    name: build (goreleaser snapshot)
    runs-on: ubuntu-latest
    needs: [lint, test, codegen]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean
