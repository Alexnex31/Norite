name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 1.25 rather than M0's 1.23: testcontainers-go (backend integration tests) declares `go 1.25.0`, which
  # raises the backend module's own directive and, through go.work, the toolchain every module builds with.
  GO_VERSION: "1.25"
  # Keep in sync with `sqlc_version` in the justfile.
  SQLC_VERSION: "v1.30.0"
  # Keep in sync with `golangci_lint_version` in the justfile.
  #
  # Pinned, not `latest`: an unpinned linter turns an upstream release into a surprise CI failure on an
  # unrelated PR. It must also be built with Go >= the highest `go` directive in the workspace (1.25.0) —
  # golangci-lint v1's final release is built with Go 1.24 and refuses to run, which is what broke M1's
  # first CI run. v2 needs golangci-lint-action v7+; v6 drives v1 only.
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli, gui, daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Glob rather than ${{ matrix.module }}/go.sum: gui still has zero dependencies and so no
          # go.sum, and setup-go fails on a path that matches nothing. (daemon grew one at M3.)
          cache-dependency-path: "**/go.sum"
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli, gui, daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Glob rather than ${{ matrix.module }}/go.sum: gui still has zero dependencies and so no
          # go.sum, and setup-go fails on a path that matches nothing. (daemon grew one at M3.)
          cache-dependency-path: "**/go.sum"
      # The backend's integration tests start a real Postgres via testcontainers. ubuntu-latest runners
      # ship a working Docker daemon, so no extra service container or setup step is needed.
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -count=1

      # go.work resolves cross-module imports from the checkout, so a module whose own go.mod and go.sum
      # are missing an entry still builds here. That was harmless while the four modules were independent
      # and stopped being so at M7, when cli began requiring daemon: a dependency added to daemon is
      # invisible from cli until something builds without the workspace, which is what a release build and
      # anyone consuming a single module actually do. This is the cheapest place to notice.
      - name: go build without the workspace
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go build ./...

  codegen:
    name: codegen is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      # sqlc output is committed so a plain `go build` needs no extra tooling. That only stays true if a
      # schema or query change can't merge without its regenerated code, which is what this checks.
      - name: sqlc generate
        working-directory: backend
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }} generate
      - name: fail if the committed output is stale
        run: |
          if ! git diff --quiet -- backend/internal/db; then
            echo "::error::backend/internal/db is out of date — run 'just sqlc-generate' and commit the result"
            git --no-pager diff -- backend/internal/db
            exit 1
          fi

  security:
    name: security (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli, gui, daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Glob for the reason the lint job gives: gui has no go.sum, and setup-go fails on a path that
          # matches nothing.
          cache-dependency-path: "**/go.sum"
      - name: install govulncheck
        # Unpinned, unlike sqlc and golangci-lint above, and for a reason that does not apply to them.
        # Pinning those stops an upstream release turning into a surprise failure on an unrelated PR.
        # Here the surprise is the product: what fails this job is a new advisory against a dependency
        # this repository already has, fetched from the vulnerability database at run time — so pinning
        # the binary would not prevent it and would only delay picking up scanner fixes.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        # The same command `just security-scan` runs, per module, so the local and CI answers cannot
        # disagree. Blocking rather than advisory: architecture.md §10 says this runs on every PR, and a
        # security job somebody has learned to scroll past is worth less than no job at all.
        run: govulncheck ./...

  build:
    name: build (goreleaser snapshot)
    runs-on: ubuntu-latest
    needs: [lint, test, codegen]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean
