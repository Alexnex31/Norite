name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"

jobs:
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli, gui, daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum exists yet in any module (zero external deps in the M0 skeleton) — nothing to key a
          # cache on. Re-enable with cache-dependency-path: ${{ matrix.module }}/go.sum once M1 adds real
          # dependencies.
          cache: false
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ matrix.module }}
          version: latest

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli, gui, daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum exists yet in any module (zero external deps in the M0 skeleton) — nothing to key a
          # cache on. Re-enable with cache-dependency-path: ${{ matrix.module }}/go.sum once M1 adds real
          # dependencies.
          cache: false
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -count=1

  build:
    name: build (goreleaser snapshot)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum exists yet in any module (zero external deps in the M0 skeleton) — nothing to key a
          # cache on. Re-enable once M1 adds real dependencies, with cache-dependency-path listing all four
          # modules' go.sum files (this job isn't matrixed, unlike lint/test above).
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean
