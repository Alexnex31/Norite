name: Release

# Publishes a GitHub release through goreleaser, and only ever for a `v*` tag (ADR 0033). Milestone tags
# (`m18`, `m20a`, …) are internal markers rather than versions and must never reach this workflow, which is
# why the trigger names `v*` explicitly instead of every tag. CI (ci.yml) still runs on every push, tags
# included; this workflow is the only thing that publishes.
#
# Creating the tag is the author's step and nothing here does it.
on:
  push:
    tags:
      - "v*"

# contents: write publishes the release. id-token: write lets cosign obtain this workflow's GitHub OIDC
# token, which Sigstore exchanges for the short-lived certificate checksums.txt is signed with (M20a): the
# certificate names this file and the tag, and that identity is what the release footer's verify command
# pins. Nothing else in the job can use the token, since no other step asks for one.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with GO_VERSION in ci.yml.
  GO_VERSION: "1.26"
  # Keep in sync with GORELEASER_VERSION in ci.yml and `goreleaser_version` in the justfile, which
  # `just release-dry-run` uses. Pinned for the reason every tool here is: `latest` would make an upstream
  # release the first thing a tag tests, on the one run that publishes.
  GORELEASER_VERSION: "v2.18.2"
  # The cosign the release signs with. Its `sign-blob --bundle` writes the Sigstore bundle format the release
  # footer's `verify-blob` reads, so the footer asks testers for cosign v3: a major version changes here only
  # with the footer read again beside it.
  COSIGN_VERSION: "v3.1.3"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything that is not a three-component SemVer tag
        # The `v*` glob also matches `v0.1-alpha` or `vnext`, and goreleaser's version parser is lenient
        # about missing components, so it is not relied on to refuse the first. ADR 0033 says a two-component
        # tag is never a version, so it fails here before anything is built. This is semver.org's own
        # pattern with the leading `v`.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -qP '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH[-prerelease] (ADR 0033); refusing to release it"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Named rather than discovered. goreleaser finds the current tag with `git describe`, and the
          # commit completing a phase carries an `m<N>` tag as well as the version, so discovery could hand
          # it the milestone tag, which is not SemVer, or pick between the two by accident.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
