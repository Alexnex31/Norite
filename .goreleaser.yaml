# Builds and packages the four current binaries. No signing wired in yet — Sigstore/cosign release signing
# lands at Milestone M24 (docs/architecture.md §13, ADR 0020), so a release cut before it carries only
# checksums.txt. voiceworker/ joins once it exists (Phase E); frontend/ is never a goreleaser artifact (it's
# embedded into the backend binary, or served by the later web SPA's own build, per docs/architecture.md §1).
#
# Releases are published only by .github/workflows/release.yml, on a `v*` tag (ADR 0033). The repository
# also carries `m<N>` milestone tags, which are not versions and which goreleaser's own tag discovery cannot
# tell apart from one — a phase's last milestone commit carries both — so the workflow names the tag
# explicitly rather than letting goreleaser pick it.
version: 2

project_name: norite

before:
  hooks:
    - go work sync

builds:
  - id: backend
    dir: backend
    main: ./cmd/server
    binary: norite-server
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # AGPL section 13 obliges this instance to offer the Corresponding Source *of the running version*, and
    # GET /api/v1/meta answers with this value. The full commit rather than the tag: a commit always
    # resolves in the repository, while goreleaser strips the leading "v" from a tag, so a release tagged
    # v1.0.0 would advertise "1.0.0" and send anyone fetching it to a ref that does not exist.
    #
    # And the version, for the gateway's handshake (ADR 0033): unstamped, the server reports "dev", which
    # every client accepts without checking — so every release would skip the check it exists to make.
    ldflags:
      - -s -w -X github.com/Alexnex31/Norite/backend/internal/meta.Revision={{ .FullCommit }} -X github.com/Alexnex31/Norite/backend/internal/meta.Version={{ .Version }}

  - id: cli
    dir: cli
    main: ./cmd/app
    binary: norite
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Without this, `norite --version` reports "dev" in every shipped release — the variable's default.
    # The other three binaries get the same treatment as they grow a version to report.
    #
    # And the revision, which `norite about` prints as AGPL section 5(d)'s notice (M20a): the full commit,
    # for the backend's reason above, so it resolves in the repository the notice names. Unstamped, the CLI
    # reads the commit `go build` recorded, and says so.
    ldflags:
      - -s -w -X github.com/Alexnex31/Norite/cli/internal/cliapp.Version={{ .Version }} -X github.com/Alexnex31/Norite/cli/internal/cliapp.Revision={{ .FullCommit }}

  - id: gui
    dir: gui
    main: ./cmd/gui
    binary: norite-gui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: daemon
    dir: daemon
    main: ./cmd/daemond
    binary: norite-daemon
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # The daemon writes its version into the first line of every log file, which is the first thing anyone
    # asks for in a support conversation. goreleaser's default would set `main.version`; this binary's
    # variable is `main.Version`, so it has to be named explicitly or every release reports "dev".
    ldflags:
      - -s -w -X main.Version={{ .Version }}

# One archive per binary rather than one shared block, because each carries a different
# THIRD-PARTY-NOTICES.txt: the four binaries link different dependency sets, and a notice file listing
# modules a binary does not contain is as wrong as one omitting modules it does. Naming `files` at all
# replaces goreleaser's default set, so LICENSE and README are listed explicitly — dropping LICENSE from a
# release archive of AGPL software is the one omission that would actually matter.
archives:
  - id: backend
    ids: [backend]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: backend/internal/notices/THIRD-PARTY-NOTICES.txt
        dst: THIRD-PARTY-NOTICES.txt

  - id: cli
    ids: [cli]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: cli/internal/notices/THIRD-PARTY-NOTICES.txt
        dst: THIRD-PARTY-NOTICES.txt

  - id: gui
    ids: [gui]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: gui/internal/notices/THIRD-PARTY-NOTICES.txt
        dst: THIRD-PARTY-NOTICES.txt

  - id: daemon
    ids: [daemon]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: daemon/internal/notices/THIRD-PARTY-NOTICES.txt
        dst: THIRD-PARTY-NOTICES.txt

checksum:
  name_template: "checksums.txt"

# `auto` marks any version with a pre-release suffix (v0.1.0-alpha, v0.2.0-beta.1, v1.0.0-rc.1) as a
# pre-release on GitHub, so the "latest release" a self-hoster is pointed at is never one. Every 0.x release
# is still a *release* here, not a pre-release: SemVer's pre-release is the suffix, and ADR 0033 states the
# 0.x instability in the docs rather than by flagging every version before 1.0.0.
release:
  prerelease: auto

changelog:
  disable: true
