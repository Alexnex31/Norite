openapi: 3.1.0
info:
  title: Norite REST API
  version: 0.0.0-m4
  description: >
    Source-of-truth REST contract for the Norite backend (see docs/architecture.md §2 and §10).
    `oapi-codegen` starts generating Go server-side types and routing scaffolding from this file at
    Milestone M12; until then it is hand-maintained, but the same rule already applies — every REST
    endpoint added or changed updates this file in the same commit (CLAUDE.md rule 6).


    IDs are Snowflakes (docs/adr/0003-snowflake-ids.md) and are always sent as **quoted strings**, never
    JSON numbers: they exceed 2^53, so a client parsing them as numbers silently loses precision and
    starts confusing adjacent IDs.
servers:
  - url: /api/v1

# Every operation requires a Bearer credential unless it declares `security: []`. Stating it this way round
# means a new endpoint is protected by default, and making one public is a visible, deliberate line in the
# diff rather than an omission nobody notices.
security:
  - bearerAuth: []

tags:
  - name: observability
    description: Liveness and readiness surfaces for operators and orchestrators.
  - name: auth
    description: >
      Account creation, password login, refresh-token rotation, and scoped API tokens. Tokens are issued
      directly in the JSON body, never as cookies — the CLI, GUI and daemon have no cookie jar
      (docs/adr/0011-token-based-client-auth.md). A future web SPA gets cookies from a BFF layer in front of
      this same API, not from these endpoints.
  - name: users
    description: Account profile surfaces.
  - name: guilds
    description: >
      Guilds, their channels, their roles and their membership. Every route here requires an authenticated
      caller, and every mutation resolves permissions against data loaded for the specific guild or channel
      in the request path — see `docs/adr/0008-guild-authority-hierarchy.md` for the six-layer authority
      model these endpoints implement.


      **An API token additionally needs a scope**: `guilds.read` for the read routes, `guilds.write` for
      the rest. A user's own access token passes both by design, since a scope bounds a *delegated*
      credential and never a person. Permission resolution still runs underneath, so a token holding
      `guilds.write` can do exactly what its owner could and no more.

paths:
  /meta:
    get:
      summary: Instance metadata and the AGPL source offer
      description: >
        The Corresponding Source offer AGPL-3.0 section 13 requires this instance to make to anyone
        interacting with it over a network, plus the license identifier its own code is distributed under.


        Unauthenticated **by obligation, not by convenience**. Section 13 owes the offer to every user
        interacting with the software remotely, so an answer behind a credential would not discharge it —
        which is also why this is not under `/instance`, a group whose defining property is that it has no
        unauthenticated route in it.


        `source_revision` is the git revision the running binary was built from, stamped in at link time.
        A development build that was not stamped reports `unknown`, which is deliberate: a plausible-looking
        placeholder would be worse than an admission, because the field is only useful if somebody can
        actually fetch that source.


        `source_url` is configurable (`[source].url` / `NORITE_SOURCE_URL`) and defaults to the upstream
        repository. **An operator who has modified Norite must point it at their own source**, since
        section 13 obliges them to offer their users the modified source rather than this project's.


        The response is constant for the life of the process — it reads no database — so a client may cache
        it for as long as it holds a connection, and it stays available under load. It does answer 503
        while startup migrations run, like every route but `/healthz`: during that window nothing is
        serving, so there is no remote interaction to owe an offer to.
      operationId: getMeta
      tags: [observability]
      security: []
      responses:
        "200":
          description: The instance's license and source offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceMeta"
        "503":
          description: The instance is still starting; migrations have not finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /healthz:
    get:
      summary: Readiness check
      description: >
        Reports whether this instance can serve requests right now. This is a readiness check, not a
        liveness check: it returns 200 only once startup has completed — schema migrations included — and
        the instance can execute a statement against Postgres.


        503 with `status: "starting"` means the process is up but not yet ready; migrations may still be
        running (docs/architecture.md §8.16). `status: "stopping"` means it is draining during shutdown.
        `status: "degraded"` means it is past startup but cannot currently reach the database.


        The database probe behind this endpoint is cached briefly, so probe frequency does not translate
        into database load — the endpoint is unauthenticated and exempt from rate limiting, and the
        connection pool is deliberately small.


        `HEAD` is accepted as well as `GET`, since several load balancers and `curl -I` probe with it.


        Unauthenticated by design, so orchestrators and load balancers can probe it, and deliberately
        exempt from rate limiting so frequent single-source probes cannot throttle themselves into
        reporting a healthy instance as down. Response detail is kept generic for the same reason it is
        unauthenticated — it must not disclose hostnames or driver internals.
      operationId: getHealthz
      tags: [observability]
      security: []
      responses:
        "200":
          description: The instance is ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ready:
                  value:
                    status: ok
        "503":
          description: The instance is not ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                starting:
                  value:
                    status: starting
                    detail: instance is still starting up (migrations may be in progress)
                stopping:
                  value:
                    status: stopping
                    detail: instance is shutting down and draining in-flight requests
                degraded:
                  value:
                    status: degraded
                    detail: database is unreachable

    head:
      summary: Readiness check (headers only)
      description: >
        Identical to `GET /healthz` in status code and headers, with no response body. Registered
        explicitly because chi routes methods separately — a GET-only route answers HEAD with 405 — and
        several load balancers, as well as `curl -I`, probe with HEAD.
      operationId: headHealthz
      tags: [observability]
      security: []
      responses:
        "200":
          description: The instance is ready to serve.
        "503":
          description: The instance is not ready to serve.

  /auth/register:
    post:
      summary: Create an account
      description: >
        Accepts a registration. It does **not** log the new account in: registration and login are separate
        operations with separate inputs — login needs a `device_id`, which registration has no business
        requiring — and fusing them would force a client that only wanted an account to invent a device
        identity.


        **Answers 202 with a fixed body whether or not the address already has an account, and never
        returns the account.** There is no user to return when the address was taken, and any response
        shaped around one would differ between the two cases. What differs instead is the mail: a
        confirmation link for a new account, a "somebody tried to register with your address" notice for one
        that already exists. The only party told which happened is whoever controls the address.


        A taken **username** is still refused 409. A username is an `@handle` — public by construction, and
        discoverable by any client that can look one up — so refusing it discloses nothing; an address is
        not public. That asymmetry is deliberate.


        While the instance is configured for invite-only registration, `invite_code` is required: a request
        without one is refused 403 `invite_required`, and one whose code is unknown, exhausted or expired is
        refused 403 `invite_invalid`. On an open instance the field is ignored rather than rejected, so a
        client that always sends one works against either mode without knowing which it faces.


        Between M4 and M10 a gated instance refused registration outright with `registration_closed`. That
        code is gone: registration is not closed on a gated instance, it has a precondition, and a client
        that can tell "you need a code" from "your code does not work" can prompt for one instead of giving
        up. Note that OAuth sign-up still refuses outright on a gated instance — there is no way to carry a
        code through a provider redirect, so an invite-only instance is password-registration-only.


        Until M10 this endpoint disclosed whether an address was already taken, which made the instance
        enumerable — it was the only endpoint here that did, and it did so because nothing could verify an
        address, so there was no way to accept a registration and sort it out by mail. Email verification
        removed that constraint. Timing is part of the guarantee too: the password is hashed *before* the
        address is examined, so both branches pay the same argon2id cost.
      operationId: register
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              minimal:
                value:
                  username: ada
                  email: ada@example.com
                  password: correct horse battery staple
      responses:
        "202":
          description: >
            Accepted. Identical whether or not the address already had an account — see the description.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                additionalProperties: false
                properties:
                  message:
                    type: string
                    description: >
                      A sentence to show the person who registered. Do not branch on it: it is prose, it
                      is not stable across versions, and the status code carries everything a client needs.


                      It depends on the instance and never on the request. An instance with a mail relay
                      says to check the mail; an instance without one cannot verify an address at all, so
                      it creates the account usable and says so rather than pointing at a mailbox nothing
                      will arrive at. Both branches of one request — address free, address already
                      registered — always get the same sentence, which is the property this endpoint is
                      shaped around.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: >
            This instance requires an invite code and the request brought none (`invite_required`), or the
            code it brought is not usable (`invite_invalid`). The second is deliberately one answer for
            unknown, exhausted and expired: distinguishing them would let somebody holding no valid code
            learn which codes exist by watching the message change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The username is already in use. **Not** returned for an address — that case answers 202, which
            is what closes the account-existence oracle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          description: >
            **Reserved for M67a and emitted by nothing today.** This instance requires a challenge to be
            solved before it will accept a registration; the body carries what to solve, and the solution
            comes back in `challenge_response`.


            A distinct status rather than a field on the 403, for the reason M11a gave when a login that
            owes a second factor answered 202 rather than a discriminated body: a client branches on
            status, and oapi-codegen gets exactly one response object per status. This contract has already
            carried one schema that no response could satisfy, and does not need a second.


            428 is chosen with a caveat worth stating rather than glossing. RFC 6585 §3 introduces it for
            *conditional* requests — `If-Match`, avoiding the lost-update problem — and this is not that.
            It is used here because it is the only unused code on this operation whose plain meaning
            ("there is a precondition you have not met") matches, 403 is already spoken for by the invite
            states and carries `Error`, and 202 means success. Widespread practice has moved 428 toward
            "do something else first"; the alternative was overloading 400.


            **Self-hosted instances never emit this**, and neither does the flagship today. A client that
            has never seen it is not broken, and one that handles it works unchanged when M67a lands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationChallenge"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      summary: Exchange a password for an access and refresh token pair
      description: >
        Verifies a password and starts a refresh session for the given device.


        `device_id` is required and is the key to the whole refresh model: a refresh token belongs to a
        *device*, not to an account. Rotation and reuse-detection act strictly within one `device_id`, so a
        user running daemons on a laptop and a desktop cannot have one machine's activity log the other out
        (docs/adr/0011-token-based-client-auth.md). A login with no device identity would have to share a
        family with every other such login, and rotation would then log them all out.


        A successful login **supersedes that device's previous session**: any live session for the same
        (user, device) is revoked before the new one is created. Without that, every login would leave
        another redeemable refresh token behind, so a token stolen months ago would stay valid indefinitely.
        Other devices are untouched.


        Every credential failure returns the same 401 with the same message — unknown account, wrong
        password, and an OAuth-only account with no password set are deliberately indistinguishable. The
        server also performs a full password hash against a dummy value when no account matched, so response
        *timing* does not reveal whether an address is registered either.
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              daemon:
                value:
                  email: ada@example.com
                  password: correct horse battery staple
                  device_id: 3f1c8a52-daemon-install-id
                  device_name: ada's laptop
      responses:
        "200":
          description: The password was correct; a token pair was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "202":
          description: >
            The password was correct and the account has a second factor. No session exists yet — finish at
            `POST /auth/2fa/verify` with the challenge below.


            A distinct status rather than a discriminated body, so a client branches on the status and one
            response object belongs to each. Whether an account has a factor is therefore observable, but
            only to somebody who already holds its password, which is not a disclosure worth defending
            against. Every *failure* above is unchanged: the factor is asked about strictly after the
            password verifies, so an instance with second factors enumerates no better than one without.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorChallenge"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >
            Invalid email or password. Deliberately identical for every credential failure — see the
            description above — and from M10 that includes a correct password on an address that has not
            been confirmed yet.


            A distinct answer for the unconfirmed case would reopen the account-existence oracle
            `/auth/register` closes, in two requests: register an address with a password of your choosing
            and then log in with it. If the address were free an account would now exist with that password
            and the login would say "unconfirmed"; if it were taken nothing would have been created and the
            same login would say "wrong password".


            A correct password on an unconfirmed address queues a fresh confirmation link to that address
            instead, so the person who owns it learns why they could not sign in. A wrong password queues
            nothing, so this cannot be used to send mail to an address somebody is guessing at.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/refresh:
    post:
      summary: Rotate a refresh token
      description: >
        Exchanges a refresh token for a fresh pair, within the same device's family.


        Rotation is **single-use**: the presented token is revoked in the same transaction that creates its
        successor. Presenting it again is therefore unambiguous evidence of replay — either a client retried
        after a lost response, or the token was stolen. The two are indistinguishable from the server, so the
        pessimistic reading wins and **that device's entire session family is revoked**. Other devices are
        never affected.


        A token that was revoked *without* being rotated — by logout, or by a later login superseding it —
        is simply invalid and triggers none of that. Conflating the two would mean logging out, logging back
        in, and retrying the stale token once would revoke the session just created.


        Replay and an unknown token return the identical 401. Telling a caller "that token was already used"
        would confirm to a thief that they hold something real, and that the legitimate client got there
        first.
      operationId: refresh
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair was issued; the presented refresh token is now spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >
            The refresh token is invalid, expired, revoked, or was already used. Replay additionally revokes
            that device's remaining sessions, but the response is the same either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      summary: Revoke the session a refresh token belongs to
      description: >
        Takes the *refresh* token rather than the access token: the access token is what the caller
        authenticates with, but the refresh session is the thing that needs ending — an access token expires
        on its own within its 15-minute TTL regardless.


        Idempotent by nature. An unknown, malformed, or already-revoked token is not an error: a client
        retrying after a dropped response must not be told its logout failed.


        This revokes one session. Revoking every session for an account — the primitive a ban and a
        self-service account deletion both invoke — is Milestone M11.
      operationId: logout
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: The session is revoked, or was already not valid. No body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/verify/request:
    post:
      summary: Re-send an email verification link
      description: >
        Sends a fresh confirmation link, if the address belongs to an account whose address is not yet
        verified.


        **Always answers 202**, whatever it found. Like password reset, this endpoint has no business
        telling a caller whether an address is registered — and here it would also disclose whether the
        account behind it is mid-signup, which is a narrower and more useful thing for an attacker to know.


        A no-op on an instance with no mail relay: there is nothing to send, and registration marks accounts
        verified on creation there because nothing can verify anything.
      operationId: requestEmailVerification
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "202":
          description: Accepted. Says nothing about what was found.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                additionalProperties: false
                properties:
                  message:
                    type: string
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /verify:
    # Served at the instance root, not under /api/v1, for the same reason /reset is: a person opens this
    # from an email.
    servers:
      - url: /
    get:
      summary: The address-confirmation page
      description: >
        The page the link in a verification email opens. Carries the token into a hidden form field and does
        **not** verify it — checking on GET would report whether a link is live before anyone submits
        anything, which makes the page an oracle for exactly that, and would let an already-followed link be
        told apart from one that never existed.


        The confirmation is a form POST rather than the link doing the work on sight. That is not ceremony:
        a GET that verified would be triggered by anything that follows links in mail — scanning gateways,
        chat-client link previewers, some antivirus products — so an address could be confirmed by software
        the person never saw, and the link would be spent before they clicked it. It is also this project's
        rule 4, which requires GET to stay side-effect-free.
      operationId: getVerifyPage
      tags: [auth]
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: The verification token, carried into the form. Absent renders the page with an
            empty field, which then fails on submit.
          schema:
            type: string
      responses:
        "200":
          description: The confirmation page.
          content:
            text/html:
              schema:
                type: string

    post:
      summary: Confirm an email address
      description: >
        Spends the token and marks the address verified, then renders the outcome. Single-use, and refused
        if the account's address changed after the link was issued — otherwise registering with an address
        you control, changing it to one you do not, and following your own link would mark somebody else's
        address verified.


        Every failure renders one message: unknown, expired, already used and address-changed are not
        distinguished, because telling whoever holds a stolen link which it is helps only them.
      operationId: confirmEmailVerification
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: The address is confirmed.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The link is not valid. Renders the form again with a message.
          content:
            text/html:
              schema:
                type: string

  /oauth/continue:
    # Served at the instance root beside /oauth/signup, for the same reason: a person opens this from an
    # email, and it is not an API a client codegens against.
    servers:
      - url: /
    get:
      summary: Resume a sign-up whose provider would not vouch for the address
      description: >
        Renders the username form for a sign-up that could not proceed in the browser. The link is delivered
        by email, and opening it is the evidence the provider declined to give — it proves control of the
        mailbox.


        This exists so the OAuth callback can answer identically whether or not the address already has an
        account. Anyone can present any address at a provider that does not verify it (GitHub permits it for
        every address), so a callback that showed a username form for an unknown address and a refusal for a
        registered one would answer "does this address have an account here" to whoever asked. Both cases
        render "check your email" instead, and the difference travels to the mailbox — the only party
        entitled to it.


        Carries the token into the form and does **not** verify it, exactly as `/reset` and `/verify` do.
      operationId: continueOAuthSignup
      tags: [auth]
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: The signup continuation token from the email.
          schema:
            type: string
      responses:
        "200":
          description: The username form.
          content:
            text/html:
              schema:
                type: string

  /reset:
    # Served at the instance root, not under /api/v1: this is a page a person opens from an email, not an
    # API a client codegens against, and putting it under the versioned prefix would imply it moves when
    # that version does. Documented here anyway because it is a route the backend serves, and
    # cmd/server/contract_test.go holds the router and this file to the same set.
    servers:
      - url: /
    get:
      summary: The password-reset form
      description: >
        The page the link in a reset email opens. Carries the token in its query string into a hidden form
        field; it does **not** verify it. Checking on GET would report whether a token is live before
        anyone submits anything, which makes the page an oracle for exactly that.


        Returns HTML, not JSON, and needs no authentication: the token is the entire authority, and the
        person opening it is by definition locked out of the account.
      operationId: getResetPage
      tags: [auth]
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: The reset token from the email. Absent or wrong, the form still renders and the
            submission is what fails — for the reason above.
      responses:
        "200":
          description: The form.
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Submit the password-reset form
      description: >
        The form target. Form-encoded rather than JSON so the page needs no JavaScript, which is what lets
        its Content-Security-Policy forbid scripts outright.


        No CSRF token participates and none is needed: the reset token *is* the authority, so an attacker
        able to forge this request already holds it and could submit the form directly. No ambient
        credential is involved — the same reason the rest of this API carries no CSRF middleware.


        Same effects as `POST /api/v1/auth/password/reset`: single-use token, every session and API token
        on the account revoked.
      operationId: submitResetPage
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
      responses:
        "200":
          description: The password was changed. HTML confirmation.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: >
            The token or the password was rejected. The form is re-rendered with one generic message —
            expired, spent, unknown and no-longer-matching are not distinguished.
          content:
            text/html:
              schema:
                type: string

  /oauth/signup:
    # Served at the instance root, beside /reset: a form a person submits, not an API a client codegens
    # against. Documented here because cmd/server/contract_test.go holds the router and this file to the
    # same set.
    servers:
      - url: /
    post:
      summary: Submit the OAuth username form
      description: >
        The form target for the page the callback renders. Form-encoded rather than JSON so the page needs
        no JavaScript, which is what lets its Content-Security-Policy forbid scripts outright.


        No CSRF token participates and none is needed: the signup token is the entire authority, and
        anyone able to forge this request already holds it.


        Same effects as `POST /api/v1/auth/oauth/complete`. A rejected username re-renders the form so it
        can be fixed without restarting the flow; an expired token cannot be re-rendered and ends on an
        error page.


        If the flow that produced this form named a `client_redirect_uri`, success is a 302 to it rather
        than a page. **The destination comes from the signed continuation token, never from this form**,
        and a `client_redirect_uri` field in the body is ignored. That is the whole reason it rides in the
        token: this request is written by whoever is looking at the page, and a redirect they could supply
        would let them choose where somebody else's exchange code is delivered.
      operationId: submitOAuthSignup
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [signup_token, username]
              properties:
                signup_token:
                  type: string
                username:
                  type: string
                  minLength: 2
                  maxLength: 32
      responses:
        "200":
          description: The account was created. HTML, carrying the one-time exchange code.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: >
            The flow named a loopback listener, so the result goes there instead of onto a page — `?code=`
            when the account was created, or `?error=` when something ended the sign-up that retyping a
            username cannot fix (`registration_closed`, `email_taken`, `server_error`). A rejected or taken
            username is *not* reported this way: the form re-renders so it can be corrected, and the
            listener keeps waiting.
          headers:
            Location:
              schema:
                type: string
                example: "http://127.0.0.1:51763/callback?code=noc_..."
        "400":
          description: The username was rejected, or the sign-up expired. HTML.
          content:
            text/html:
              schema:
                type: string

  /device:
    # Served at the instance root, beside /reset: this is a URL somebody types by hand, from one screen
    # onto another, and every character of it is a character they have to copy. Documented here because
    # cmd/server/contract_test.go holds the router and this file to the same set.
    servers:
      - url: /
    get:
      summary: The device-code entry form
      description: >
        Where a person goes to finish a sign-in started on a machine with no browser. Returns HTML and
        needs no authentication — signing in is what the page is for.
      operationId: getDevicePage
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: >
            Prefills the field and does nothing else — no lookup, no state, no step skipped. A value that
            is not a well-formed user code is dropped rather than echoed back.


            This is deliberately not `verification_uri_complete`. That parameter completes the entry step
            from the URL, which turns a phished link into a single click; this one saves eight keystrokes
            somebody still has to look at before pressing Continue.
      responses:
        "200":
          description: The form.
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Submit a user code
      description: >
        Looks the code up and, if it is live, offers the ways to sign in. Never issued, expired, already
        approved, denied and already spent all return the same message — the differences are only useful to
        somebody trying codes.
      operationId: submitDevicePage
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
                  description: >
                    Case, spaces and the grouping dash are all normalized away, so a person is not punished
                    for typing what their phone keyboard offered.
      responses:
        "200":
          description: The sign-in step, carrying a signed continuation.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The code cannot be acted on. The entry form is re-rendered with one message.
          content:
            text/html:
              schema:
                type: string

  /device/signin:
    servers:
      - url: /
    post:
      summary: Sign in on the device-code page with a password
      description: >
        The password branch of the verification page. Answers exactly what `POST /api/v1/auth/login`
        answers for a wrong password, a missing account and an account that has no password at all —
        one message — for the reason that endpoint gives.


        Succeeding does **not** authorize anything. It produces the approval step, which is a separate
        request. No CSRF token participates and none is needed: the continuation in the body is the
        authority, and no ambient credential is involved.
      operationId: signInOnDevicePage
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [device_token, email, password]
              properties:
                device_token:
                  type: string
                  description: >
                    The signed continuation from the previous step. Carries which authorization is being
                    worked on; asserts nothing about who is signing in, which is what the next one is for.
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: The approval step.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: The credentials did not match. The sign-in step is re-rendered.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The continuation has expired, or the authorization has since been decided.
          content:
            text/html:
              schema:
                type: string

  /device/2fa:
    servers:
      - url: /
    post:
      summary: Prove a second factor on the device-code page
      description: >
        Reached only when the account that just signed in has a second factor. The device flow is the one
        sign-in path where the factor can *only* be asked for here: the waiting client redeems its device
        code without proving anything, because there is nobody at that terminal to type six digits, so this
        browser is the only place the question can be put.


        Accepts either a current authenticator code or one of the account's recovery codes, at one entry
        point. Somebody who has lost their phone types what they have and it works; a separate endpoint for
        recovery would be the one nobody can find at the moment they need it.


        Succeeding does **not** authorize anything — it produces the approval step, which is still a
        separate request, exactly as the password branch does.
      operationId: proveFactorOnDevicePage
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [device_token, code]
              properties:
                device_token:
                  type: string
                  description: >
                    A continuation of its own type, distinct from the one the previous step carried and
                    from the one the next step takes. It asserts that this browser has proved a password
                    but not yet a factor — a state that is neither of the other two, and collapsing it into
                    either would authorize before authentication had finished.
                code:
                  type: string
                  description: An authenticator code or a recovery code.
      responses:
        "200":
          description: The approval step.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: >
            The code did not match. The factor step is re-rendered with the same continuation, so a mistyped
            code costs a retry rather than the whole flow. One message for a wrong authenticator code and a
            wrong recovery code alike.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The continuation has expired, or the authorization has since been decided.
          content:
            text/html:
              schema:
                type: string

  /device/approve:
    servers:
      - url: /
    post:
      summary: Approve or deny a device authorization
      description: >
        The step this flow exists to make deliberate, and the only real defense it has.


        The device-code grant's live risk is not somebody guessing a code — it is somebody being sent one
        and authorizing a stranger's machine without understanding that is what they did (RFC 8628 §5.4).
        Nothing cryptographic prevents that, so what is done instead is done here: the page names the
        device asking, shows the code back so it can be compared against the screen it came from, and says
        plainly that a code somebody sent you is a request to sign them in as you.


        Requires an approval continuation specifically. The one from the entry step is refused, because a
        browser that knows a code has not proved whose account it is.
      operationId: decideDeviceAuthorization
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [device_token, decision]
              properties:
                device_token:
                  type: string
                  description: The signed continuation from the sign-in step, which names both the
                    authorization and the account.
                decision:
                  type: string
                  enum: [approve, deny]
                  description: >
                    Anything other than `approve` denies, so a malformed submission fails closed. A denial
                    is final: the waiting client is told on its next poll and the code cannot be reused.
      responses:
        "200":
          description: Approved or denied. HTML confirmation either way.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The continuation has expired, or the authorization has since been decided.
          content:
            text/html:
              schema:
                type: string

  /auth/password/reset/request:
    post:
      summary: Request a password reset email
      description: >
        Always answers 202, whether or not the address belongs to an account.


        Unlike registration — which necessarily discloses whether a name is taken — this endpoint has no
        reason to say whether an address is registered, and saying so would turn it into an
        account-enumeration oracle for any address someone cares to try. Timing does not disclose it
        either: the message is handed to a background queue, so the request does the same work in both
        cases.


        The one failure it does report is 503 `reset_unavailable`, when the instance has no SMTP relay
        configured. That answer does not depend on the address, so it discloses nothing — and an operator
        who never configured a relay has not chosen for reset to fail silently.


        Requesting again invalidates any earlier token for the account, so only the most recent email
        works.
      operationId: requestPasswordReset
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: >
            The request was accepted. This says nothing about whether an account exists, and nothing about
            whether an email was actually sent.
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: This instance has no email relay configured (`reset_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/password/reset:
    post:
      summary: Set a new password using a reset token
      description: >
        Spends the token and sets the password. The token is single-use and expires an hour after it is
        issued.


        Every way a token can be bad — unknown, expired, already spent, or issued to an address the
        account no longer uses — is reported as the same 401. Distinguishing them would tell whoever holds
        a stolen link which of those it is.


        **This revokes every credential on the account**: all sessions, on every device, and all API
        tokens. A reset is how someone recovers a compromised account, so a credential an intruder minted
        must not survive it. Bots and scripts need new tokens afterwards.
      operationId: confirmPasswordReset
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: >
            The password is changed and every session and API token on the account is revoked. No body —
            the caller signs in again with the new password.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The token is unknown, expired, already used, or no longer matches the account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/oauth/{provider}/authorize:
    get:
      summary: Begin an OAuth sign-in
      description: >
        Redirects (302) to the provider's consent screen. Mints a single-use state and a PKCE code
        verifier, both held server-side — the verifier never travels through the browser or the provider,
        which is the entire point of PKCE.


        Returns 404 for a provider this instance has not configured. Which providers exist is not secret,
        but an unconfigured one is indistinguishable from one that does not exist at all.


        **`flow_challenge` is required**, and is derived from a secret your client keeps:


        1. `flow_verifier` = the ASCII string `nof_` followed by 32 cryptographically random bytes,
           base64url-encoded without padding (so 47 characters in total). Keep it in memory.

        2. `flow_challenge` = the SHA-256 of that **whole ASCII string, `nof_` prefix included**,
           base64url-encoded without padding (43 characters). Send it here.

        3. Present the verifier itself as `flow_verifier` at `POST /auth/oauth/exchange`.


        Note that the challenge hashes the prefixed string, not the 32 raw bytes — the prefix is part of
        the credential, as it is for every other opaque token this API issues, so that one turning up in a
        log is identifiable on sight.


        This binds the sign-in to your client: without it any browser could complete any outstanding
        authorization request, and the code that came back would sign whoever opened the link into
        whichever account consented. It is PKCE's guarantee applied to the client-to-Norite hop, and it is
        mandatory because an optional binding is none — the attack is built by whoever starts the flow.


        **`client_redirect_uri` is optional**, and is how a program with no browser of its own — a
        command-line client, an editor plugin — receives the result. Name a listener you have already
        bound on this machine, and the callback returns there carrying the one-time code instead of
        rendering a page for a person to read. Omit it and nothing changes from a browser's point of view.


        The rules are strict, and each one is refusing a way a URL can look like one host and resolve as
        another. It must be `http` (never `https`: a loopback listener has no certificate anyone can
        validate), on a **loopback IP literal** with an **explicit port**, carrying no userinfo, no query
        and no fragment, and at most 256 characters. `http://127.0.0.1:51763/callback` is the shape.
        `http://[::1]:51763/callback` is accepted too.


        **`localhost` is refused**, and this is the rule that surprises people. A name is resolved by the
        browser through `/etc/hosts` and DNS, either of which can be made to point off this machine, so it
        cannot carry the guarantee the check exists to make. An IP literal is resolved by nobody. RFC 8252
        §8.3 says the same.


        No port is privileged and none is registered anywhere: the provider never sees this URI — it
        redirects to *this instance*, which then redirects to you — so pick any free port. Nothing about
        it needs to match what is registered with Google or GitHub, which is and stays this instance's own
        callback.


        An authorization request lives **15 minutes**. A client waiting on a listener should not give up
        sooner than that: a second factor is unhurried, and the instance will still complete a sign-in the
        client has stopped listening for.
      operationId: beginOAuth
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: flow_challenge
          in: query
          required: false
          description: >
            Base64url (unpadded) SHA-256 of the flow verifier. 43 characters.


            Required for every flow a client starts. Exactly one of `flow_challenge` and `device_token`
            must be present — see `device_token` for what the second one is and why it does not need this.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
        - name: client_redirect_uri
          in: query
          required: false
          description: >
            A loopback listener to return to instead of rendering the callback's page. `http` only, on a
            loopback IP literal, with an explicit port, and with no userinfo, query or fragment.


            Refused alongside `device_token`: a device flow ends on a page this instance renders, so there
            is no listener for it to be returned to.
          schema:
            type: string
            maxLength: 256
            example: "http://127.0.0.1:51763/callback"
        - name: device_token
          in: query
          required: false
          description: >
            The continuation from this instance's own device-verification page, present exactly when
            somebody is finishing a device-code sign-in with a provider (`/device`). It names the
            authorization being completed, so the callback ends on that flow's approval step rather than
            on a code or a redirect.


            **Not a substitute for `flow_challenge`, and not a case of the binding becoming optional.** A
            challenge exists so that the code a flow produces is redeemable only by the client that began
            it — and a device flow produces no code at all. The credential the waiting client will redeem
            is its device code, which it has held since before the browser was involved. Somebody who
            stole this parameter and completed the flow in their own browser would be shown an approval
            page for their own provider account, authorizing a device they already control.


            Clients do not construct this value. It comes from a link on the verification page and is
            useless anywhere else.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider.
          headers:
            Location:
              schema:
                type: string
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/oauth/{provider}/callback:
    get:
      summary: The provider's redirect target
      description: >
        Where the provider sends the user back. Consumes the state, exchanges the authorization code, and
        renders HTML — not JSON, because a browser lands here.


        **It never returns tokens.** A redirect carrying a token pair would put credentials in a URL, and
        so in history, in a Referer, and in every proxy log on the way. It hands over a one-time code
        instead, which a client trades at `POST /auth/oauth/exchange`.


        Three outcomes: an already-linked identity, or one whose provider-verified email matches an
        account, ends on a page carrying that code; an unrecognised identity ends on a form asking for a
        username, because no account is created until one is chosen; anything else ends on an error page.


        **When the flow named a `client_redirect_uri`, the first and third of those become a 302** to that
        listener instead — `?code=…` on success, `?error=…` on failure, and never both. The second still
        renders the username form; the redirect is carried across it inside the signed continuation token
        and applies to the form's own result.


        What travels there is worth separating from the paragraph above, because it looks like the same
        thing and is not. A token pair is long-lived, bearer, and would cross the public internet. This is
        a code that expires in two minutes, works once, is useless to anyone without the `flow_verifier`
        that never left your process, and goes to an address on the machine it was already on. The
        destination is fixed when the flow starts and read back from the state — supplying
        `client_redirect_uri` on *this* request does nothing, deliberately, since this URL is presented by
        whoever holds the link.


        The refusal worth naming: **an address the provider has not verified never reaches an account**,
        whether or not one already exists. Auto-linking on an unverified address would let anyone who can
        put another person's address on a provider account take over the matching Norite account; creating
        a *new* account from one would register someone else's address to whoever typed it and record it as
        verified. Both are refused.


        The answer is identical in the two cases — one message, carrying both ways forward — because
        differing messages would report whether an address is registered to anyone able to present it
        unverified at a provider, and GitHub permits that for any address at all.


        A conflict is also possible, and rendered as its own message: the provider account is already
        linked to a different Norite account (most often one since deleted), or the matched account
        already has a different account at that provider.
      operationId: oauthCallback
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Set by the provider when the user declined or it refused. Treated as an ordinary
            abandonment, not a fault.
      responses:
        "200":
          description: Signed in, or asking for a username. HTML.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: >
            Only when the flow was started with a `client_redirect_uri`. The Location is that URI with
            exactly one parameter: `code` on success, or `error` on failure. A failure never carries a
            code.


            The error values are a fixed vocabulary and there is deliberately no `error_description`: a
            loopback listener is a socket any local process can write to, so nothing free-form — from a
            provider or from anyone else — is put on it. Write your own wording from these.


            `access_denied` (declined at the provider), `email_unverified` (the provider will not vouch
            for the address, so it reaches no account), `identity_linked_elsewhere`,
            `account_already_linked`, `registration_closed`, `email_taken` (claimed between the callback
            and the sign-up form), `no_email`, `server_error`. Treat an unrecognised value as
            `server_error`.
          headers:
            Location:
              schema:
                type: string
                example: "http://127.0.0.1:51763/callback?code=noc_..."
        "400":
          description: >
            The state was unknown, expired or already spent; the provider refused; or the identity was
            refused by the linking rule. HTML, with one message per case.


            A failure this early cannot know a listener — the state has not been consumed, and the only
            other place a destination could come from is this request, which is exactly what is not
            trusted. So a bad state renders even for a flow that named one.
          content:
            text/html:
              schema:
                type: string
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/oauth/exchange:
    post:
      summary: Trade a one-time code for a token pair
      description: >
        The second half of every OAuth sign-in. The code is single-use and expires in minutes; presenting
        it twice fails.


        This is where `device_id` finally arrives. A browser does not have one — the client that ends up
        holding the tokens is what knows its own device identity, and the refresh family is scoped to it
        exactly as it is for a password login (ADR 0011).
      operationId: exchangeOAuthCode
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthExchangeRequest"
      responses:
        "200":
          description: A token pair, identical to what a password login returns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "202":
          description: >
            The account has a second factor. A provider proved control of a provider account; it did not
            prove possession of this account's factor, which is the entire point of having one. Finish at
            `POST /auth/2fa/verify`, exactly as a password login does.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorChallenge"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The code is unknown, expired, already spent, or bound to another client's flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/oauth/complete:
    post:
      summary: Finish an OAuth sign-up by choosing a username
      description: >
        The JSON equivalent of the username form the callback renders, for a client driving the flow
        itself.


        Nothing exists until this succeeds: the account, its provider link and its first session are
        created together in one transaction. The signup token carries the provider-verified identity in
        the meantime, so there is no half-created account for anything else to trip over.


        The username is subject to exactly the rule registration applies — letters and digits in any
        script plus `_`, `.` and `-`, NFKC-normalised before the uniqueness check.


        Returns an exchange code rather than a token pair, so both completion paths end the same way.


        **A sign-up started from the device verification page cannot be finished here** and is refused
        `400`. That flow ends on an approval screen in a browser — a person still has to say yes — and
        there is nothing this endpoint could render or hand back. The refusal happens before the account is
        created, so retrying it changes nothing; finish the sign-up in the browser the code was entered in.
      operationId: completeOAuthSignup
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCompleteRequest"
      responses:
        "200":
          description: The account was created. Trade the code at `/auth/oauth/exchange`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthExchangeCode"
        "400":
          description: >
            A malformed request, or a signup token belonging to a device-code flow — which finishes on the
            verification page's approval step and not here. Nothing is created either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The signup token is unknown, expired, or not a signup token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Registration on this instance requires an invite code (`registration_closed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: That username is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/device/code:
    post:
      summary: Start a device-code sign-in
      description: >
        For a client on a machine with no browser it can reach — a server over SSH, a container, anything
        headless. The loopback flow (`client_redirect_uri`) cannot help there: it binds a listener on
        127.0.0.1, so the browser that finishes the sign-in has to be on the same machine. This flow moves
        the browser half to a different device entirely.


        Two codes come back. `device_code` is a credential: keep it, poll `/auth/device/token` with it, and
        never display or log it. `user_code` is the short one to show a person, who opens `verification_uri`
        on their phone or laptop and types it in.


        The provider account they sign in with there is theirs to choose — this endpoint takes no provider,
        because the choice is made on the verification page, which offers a password as well as Google and
        GitHub.


        `expires_in` and `interval` are seconds and are the source of truth for a client's own loop. Do not
        hardcode either: an instance is free to tune them, and a client that assumed would poll a dead code
        or be told to slow down forever. On this instance today they are 1200 and 5.


        There is deliberately no `verification_uri_complete`. A URL that carries the user code inside it
        turns this flow's one real attack — sending somebody a code and having them approve a stranger's
        machine — into a single click, so the code is only ever typed (RFC 8628 §3.3.1, §5.4).
      operationId: startDeviceAuthorization
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCodeRequest"
      responses:
        "200":
          description: An issued authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCodeResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: >
            This instance has no `public_base_url` configured, so it cannot say where to send anybody
            (`device_flow_unavailable`). Sign in with a password, or with the loopback flow where a browser
            is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/device/token:
    post:
      summary: Poll a device-code sign-in
      description: >
        Ask whether the authorization has been approved yet. Poll no faster than the `interval` that came
        back from `/auth/device/code`.


        A POST with the code in the body, not a GET with it in the path. Two reasons, both structural: the
        successful call spends the code and starts a session, which a GET must never do — a prefetch, a
        link checker or a retry would fire it on somebody's behalf — and request paths are logged, which is
        no place for a credential.


        Every unsuccessful answer is `400` carrying one of four codes, which are RFC 8628 §3.5's and mean
        what they do there:


        * `authorization_pending` — nobody has approved it yet. Keep polling. The ordinary answer.

        * `slow_down` — you polled inside the interval. Wait longer and try again. Returned even once the
        authorization has landed, so ignoring the interval delays the sign-in rather than winning it; the
        code is not spent.

        * `access_denied` — somebody pressed Deny on the verification page. Stop; nothing will change.

        * `expired_token` — unknown, expired, or already redeemed. One answer for all three, as everywhere
        else here. Start again.
      operationId: pollDeviceAuthorization
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: Approved. A token pair, identical to what a password login returns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: >
            One of `authorization_pending`, `slow_down`, `access_denied`, `expired_token` — or an ordinary
            malformed request. Branch on `error.code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/2fa/verify:
    post:
      summary: Finish a sign-in that owed a second factor
      description: >
        The second half of a sign-in. Presented with the challenge a `202` from `POST /auth/login` or
        `POST /auth/oauth/exchange` returned, plus a code.


        Accepts either a current authenticator code or one of the account's recovery codes, at one entry
        point — somebody who has lost their phone types what they have and it works, where a separate
        recovery endpoint would be the one nobody can find at the moment they need it. A recovery code is
        spent by this call and works exactly once.


        **The device the session lands on comes out of the challenge**, never from this body. A client that
        could name a different device on the second half of a sign-in could move somebody's session onto an
        identity of its choosing.


        Public, like `/auth/login`: what the caller holds is a challenge, not a session. It carries the same
        strict rate-limit bucket as the rest of `/auth` rather than one of its own — a *shared* budget is
        stricter than a dedicated one, and unlike the device poll, submitting a code is not repetitive.
      operationId: verifyTwoFactor
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge:
                  type: string
                  maxLength: 4096
                  description: The continuation from the 202. Not a credential on its own.
                code:
                  type: string
                  maxLength: 64
      responses:
        "200":
          description: The session, as an ordinary sign-in would have returned it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: >
            The code did not match, or the challenge has expired. One answer for a wrong authenticator code
            and a wrong recovery code alike — naming which was expected would tell somebody holding a
            stolen password which to go looking for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/2fa/totp:
    post:
      summary: Begin enrolling an authenticator
      description: >
        Returns the secret once, in both the forms a client needs: base32 for typing by hand and the
        `otpauth://` URI for scanning. It is never returned again.


        **Nothing about the account changes here.** The enrollment is unconfirmed until a code proves the
        authenticator works, which is what stops a closed tab or a phone with a wrong clock locking somebody
        out of their own account. Starting again replaces an unconfirmed enrollment.


        Refused with `409` on an account that already has a *confirmed* factor: replacing a live factor is a
        change to the account's security state and goes through `DELETE` below, which asks for the current
        one first.
      operationId: beginTotpEnrollment
      tags: [auth]
      responses:
        "200":
          description: The secret, once.
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri]
                properties:
                  secret:
                    type: string
                    description: Base32, for entering by hand.
                  uri:
                    type: string
                    description: The otpauth:// URI an authenticator app scans.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is an API token. Enrollment requires a logged-in session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This account already has a confirmed second factor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Disable the second factor
      description: >
        **Requires the current factor**, not merely a live session. An access token outlives its session by
        up to `AccessTokenTTL` (§17.10), so without this a session stolen inside that window could remove
        the very control standing between an intruder and the account. An attacker must hold the factor to
        disable the factor.


        Revokes every other session, API token, outstanding OAuth exchange code and approved device
        authorization through the same primitive `POST /auth/logout/all` uses (rule 17): the sessions that
        predate this were established under different rules. The counts are reported for the reason that
        endpoint reports them — "your bots have stopped" is not something a client can infer from a 204.
      operationId: disableTwoFactor
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 64
                  description: An authenticator code or a recovery code.
      responses:
        "200":
          description: The factor is gone, and so is everything the primitive revokes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationCounts"
        "401":
          description: The code did not match, or this session has been signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The credential is an API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/2fa/totp/confirm:
    post:
      summary: Confirm an enrollment and turn the factor on
      description: >
        Proves the authenticator works and makes the factor required from this moment. Returns the
        recovery codes, which exist from here and are shown exactly once.


        Generated at confirmation rather than at enrollment deliberately: codes handed out for an enrollment
        that was never confirmed are codes somebody wrote down for a factor they do not have. The
        confirmation and the codes land in one transaction, so there is no state in which the factor is
        required and no recovery exists.
      operationId: confirmTotpEnrollment
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The factor is on, and these are the recovery codes. Shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "401":
          description: The code did not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The credential is an API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: There is no enrollment in progress, or the factor is already on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/2fa/recovery-codes:
    post:
      summary: Replace the recovery codes
      description: >
        Generates a fresh set and invalidates the old one, in a single transaction so there is no instant
        in which the account has none.


        **Requires the current factor**, for the reason disabling does: a set of codes an attacker
        generated outlives every other thing this account can do about them.
      operationId: regenerateRecoveryCodes
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The new set. Shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "401":
          description: The code did not match, or this session has been signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The credential is an API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout/all:
    post:
      summary: Sign out everywhere else
      description: >
        The general-purpose revocation primitive, sparing the device that called it. It revokes **more than
        its name suggests**, and a client should say so before and after:


        - every session on every other device;

        - **every API token on the account**, so bots and scripts stop working and must be re-minted;

        - any outstanding OAuth exchange code, which a callback page left open would otherwise still trade
          for a fresh token pair;

        - any device authorization already approved but not yet collected.


        API tokens are included deliberately. The action people reach for this with is "I think somebody
        else has my account", and a token an intruder minted outlives a signed-out session. One action that
        cannot under-clean beats two that have to be run in the right order — the same call a password
        reset makes, which states the same cost.


        The device making the request is spared as a **device**, not as a session record, so it keeps
        working across its own rotations.


        Requires a user's access token. An API token is refused: a delegated credential that can revoke its
        owner's sessions, and its owner's other tokens with them, can lock its owner out.


        **Residual window.** Access tokens are stateless and are not checked against session state, so one
        already issued to a signed-out device keeps working until it expires — at most `AccessTokenTTL`,
        15 minutes. It cannot be renewed, because the refresh session behind it is gone. This is the
        accepted trade in docs/architecture.md §17.10: the alternative is a database lookup on every
        authenticated request.

        **A signed-out device may not call this.** Access tokens are stateless, so one issued to a device
        that has since been signed out keeps working for up to `AccessTokenTTL` — but not *here*. Without
        that exception a device signed out by this endpoint could spend its remaining minutes calling it
        back, signing out the device that signed it out and taking the account's API tokens along each
        time. The answer is **401**, and re-authenticating is exactly the right response to it. A device
        that has merely *rotated* its token is live, not signed out, and is unaffected.
      operationId: logoutAll
      tags: [auth]
      responses:
        "200":
          description: What was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationCounts"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is an API token. See the description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/tokens:
    post:
      summary: Mint a scoped API token
      description: >
        Creates a long-lived, narrow-privilege credential for a bot or local automation script, and returns
        its value **exactly once**. Only a SHA-256 hash is stored, so the value cannot be recovered — a
        caller that loses it must mint a new one.


        Requires a logged-in user's access token; an API token may not call this. A credential that can mint
        credentials could grant itself scopes it does not hold, which would make every restriction in the
        scope system decorative (docs/adr/0022-access-token-signing-and-scope-model.md).


        Scopes only ever *restrict*. They bound this token below what its owner can already do, and never
        grant anything — permission resolution still runs on top of every scope check. An unrecognised scope
        is rejected rather than dropped: silently dropping one would hand back a token weaker than the caller
        believes.
      operationId: mintApiToken
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintApiTokenRequest"
            examples:
              readOnlyBot:
                value:
                  name: status bot
                  scopes: [identify]
      responses:
        "201":
          description: >
            The token was created. `value` appears in this response and nowhere else, ever.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedApiToken"
        "400":
          description: Malformed body, missing name, or an unrecognised scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The request authenticated with an API token. Minting requires a logged-in session — see the
            description above.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

    get:
      summary: List your API tokens
      description: >
        Returns the calling account's own, non-revoked API tokens. No credential material is included —
        neither the token value nor its hash.


        Requires a logged-in user's access token, like minting and revoking. Listing is not delegable
        because it discloses the names, scopes and last-use times of the account's *other* tokens: a
        compromised low-privilege bot could not use a more powerful sibling, but it could learn one exists
        and what it reaches, which is reconnaissance with no delegation use case behind it.


        `last_used_at` is recorded at most once every few minutes per token rather than on every request —
        a write on the hottest read path in the API, to keep a timestamp accurate to the second that only an
        auditing operator reads, is not a trade worth making.
      operationId: listApiTokens
      tags: [auth]
      responses:
        "200":
          description: The account's active API tokens, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The request authenticated with an API token; a logged-in session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /instance/bootstrap:
    post:
      summary: Create this instance's first administrator
      description: >
        Creates the account an instance is administered from, on an instance that has none yet. This is the
        step `norite instance init` cannot perform: the wizard writes a configuration file before the
        backend is running, so there is nothing to create an account on until afterwards.


        **Authorization is an operator token**, not an account credential — there is no account yet. See the
        `operatorToken` security scheme for what one is and how it is built. The endpoint additionally
        requires that no administrator exists, which is what makes it disable itself on success rather than
        needing a flag recording that it ran. A replayed operator token buys nothing.


        The account is created with its address already verified. The caller proved they can read this
        instance's configuration file, which is strictly stronger evidence than following a link sent to an
        address — and requiring mail would make an instance with no SMTP relay impossible to set up.


        No credential is returned. A session is scoped to a `device_id`, and the shell running setup is not
        the device that will hold one; `POST /auth/login` is the next step.
      operationId: bootstrapInstance
      tags: [instance]
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: The administrator account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >
            This instance already has an administrator (`already_bootstrapped`), or the username or address
            is taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /instance/invites:
    post:
      summary: Create an instance invite
      description: >
        Mints a code that admits one or more account creations while the instance is configured for
        invite-only registration. Callable by an instance administrator's access token or by an operator
        token; an API token is refused, because instance administration is not delegable for the same
        reason token management is not.


        Omitting `max_uses` means unlimited, and omitting `expires_in_seconds` means it never expires. Both
        are real things to want — a link in a group chat that everybody in it may use — and expressing them
        as very large numbers would be a lie a client has to interpret.
      operationId: createInstanceInvite
      tags: [instance]
      security:
        - operatorToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invite was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceInvite"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The credential is genuine but does not administer this instance. 403 rather than 401: the caller
            is authenticated, so re-authenticating would not help.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

    get:
      summary: List instance invites
      description: >
        Every outstanding invite, newest first, **including exhausted and expired ones**. An administrator
        asking what invites exist is usually asking why somebody could not use one, and a list that silently
        omits the answer is worse than one they have to read.


        Codes are returned in full. The caller is an administrator or the operator, and an invite exists to
        be handed to somebody — a list that cannot show its own contents is not a list.
      operationId: listInstanceInvites
      tags: [instance]
      security:
        - operatorToken: []
        - bearerAuth: []
      responses:
        "200":
          description: The invites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstanceInvite"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The credential is genuine but does not administer this instance. 403 rather than 401: the caller
            is authenticated, so re-authenticating would not help.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /instance/invites/revoke:
    post:
      summary: Revoke an instance invite
      description: >
        Deletes an invite so it can no longer be redeemed. Takes effect immediately.


        **The code travels in the body, and that is why this is a POST to `/revoke` rather than a `DELETE`
        on `/invites/{code}`.** A request path is written to every log line, so a code in the path is a
        credential in the log — a different audience from the database it is stored in, with different
        access control. This is the same reasoning that moved the device-code poll off
        `GET /auth/device/code/{code}`; the first version of this endpoint got it wrong by weighing who may
        call it rather than where the value ends up.


        Returns 404 when there was no such invite, so a successful revocation is distinguishable from a
        mistyped code. That discloses nothing: the caller can already list every invite on the instance.
      operationId: revokeInstanceInvite
      tags: [instance]
      security:
        - operatorToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
                  maxLength: 64
                  description: >
                    The invite code. Case, spaces and dashes are normalised away before lookup.
      responses:
        "204":
          description: The invite is revoked. No body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The credential is genuine but does not administer this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/tokens/{tokenId}:
    delete:
      summary: Revoke an API token
      description: >
        Revokes one of the calling account's own API tokens. Takes effect immediately — the next request
        presenting it fails.


        Ownership is enforced in the SQL statement itself rather than by a separate check, so there is no
        code path that forgets it (CLAUDE.md rule 1). A token belonging to another account returns 404,
        identical to one that does not exist, so this endpoint cannot be used to probe which IDs are real.
        A malformed ID returns 404 for the same reason.
      operationId: revokeApiToken
      tags: [auth]
      parameters:
        - name: tokenId
          in: path
          required: true
          description: Snowflake ID of the token to revoke, as a decimal string.
          schema:
            $ref: "#/components/schemas/Snowflake"
      responses:
        "204":
          description: The token is revoked. No body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The request authenticated with an API token; a logged-in session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such token for this account. Returned identically for a token that does not exist, one owned
            by someone else, and a malformed ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /users/@me:
    get:
      summary: Get the authenticated account
      description: >
        Returns the account behind the presented credential. Accepts either a user's access token or an API
        token holding the `identify` scope.
      operationId: getCurrentUser
      tags: [users]
      security:
        - bearerAuth: [identify]
      responses:
        "200":
          description: The authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The presented API token does not hold the `identify` scope. 403 rather than 401 because the
            credential is genuine — re-authenticating would not help, and a 401 would send a client into a
            pointless refresh loop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /users/@me/sessions:
    get:
      summary: List the devices signed in to this account
      description: >
        One entry per **device**, not per session record. A refresh token rotates: every refresh inserts a
        new session row and revokes its predecessor, so a client on a 15-minute access token produces four
        rows an hour. Listing rows would grow while somebody read it and hand out ids that were stale
        before they could be used, so each device's family is collapsed to its newest live record, and
        `id` names that record.


        `first_seen` is when the device first signed in, across the whole family — not when it last
        rotated. Sorted by `last_used_at`, most recent first.


        Requires a user's access token. An API token is refused: this discloses every machine the account
        is signed in on.
      operationId: listSessions
      tags: [users]
      responses:
        "200":
          description: The account's devices. Empty array, never null, when nothing is signed in.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is an API token. See the description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /users/@me/sessions/{sessionID}:
    delete:
      summary: Sign one device out
      description: >
        Revokes every live session in that device's family, which is what makes the action mean what the
        listing showed — revoking the single record would sign the device out only until its next refresh,
        at most fifteen minutes away.


        Signing out the device making the request is allowed; it is "sign out here".


        A session belonging to another account answers **404**, not 403. The two answers together would let
        anyone holding a list of snowflakes learn which of them name real sessions, and a snowflake carries
        its own creation time. A malformed id answers 404 for the same reason.


        Note the residual window: an access token already issued to the revoked device keeps working until
        it expires, up to `AccessTokenTTL`. It cannot be renewed. See `POST /auth/logout/all`.


        **A signed-out device may not call this either**, for the reason given there — one device at a time
        does the same damage. The answer is 401.
      operationId: revokeSession
      tags: [users]
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Snowflake"
      responses:
        "204":
          description: The device is signed out. Also the answer when it already was.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is an API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such session, or it belongs to another account. See the description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /guilds:
    post:
      summary: Create a guild
      description: >
        Creates a guild, its `@everyone` role and the creator's membership, in one transaction.


        **The only mutation in this group that checks no permission**, because there is no guild yet to
        resolve one against — anyone who can authenticate may create one. Instance-wide abuse controls
        belong at account creation (see `challenge_response` on `/auth/register`), not here.


        The three rows are written together deliberately. A guild without `@everyone` has no permission
        floor, so every member would resolve to no permissions at all; a guild without the owner's
        membership still works, because the owner bypasses permission checks by being the owner, and would
        simply be missing from its own member list. Neither is a state a client could repair.


        `@everyone` is created with viewing, sending, and voice connect and speak. Deliberately **not**
        invite creation: who may bring others in is the first decision an owner should make on purpose
        rather than discover.
      operationId: createGuild
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuildRequest"
      responses:
        "201":
          description: The guild, as created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guild"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is an API token without the `guilds.write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The account already owns the maximum number of guilds. An instance-wide bound on the one
            mutation that checks no permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /guilds/{guild_id}:
    parameters:
      - name: guild_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
    get:
      summary: Fetch a guild
      description: >
        Requires membership. A caller who is not a member gets **404, not 403** — the same answer a guild
        that does not exist gets, and deliberately so: guild ids are snowflakes, sequential and carrying
        their own creation time, so answering differently would turn a list of plausible ids into a map of
        which guilds exist on the instance. The same reasoning `DELETE /users/@me/sessions/{id}` uses.


        A member who lacks a *permission* is a different case and gets 403. They already know the guild
        exists, so telling them why discloses nothing.
      operationId: getGuild
      tags: [guilds]
      responses:
        "200":
          description: The guild.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guild"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is an API token without the `guilds.read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      summary: Update a guild
      description: >
        Partial. An absent field is left alone, which is why removing a description needs
        `clear_description` rather than a null — a decoder cannot tell an explicit null from an absent
        field, and if absent meant "clear" every partial update would erase what it did not mention.


        Requires `MANAGE_GUILD`.
      operationId: updateGuild
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGuildRequest"
      responses:
        "200":
          description: The guild, as updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guild"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Delete a guild
      description: >
        **Owner only**, or an Instance Admin. Not `MANAGE_GUILD`, which is the bit for renaming a guild and
        editing its settings and one an owner reasonably delegates. Deleting destroys every channel,
        message and membership in it, cascading, with no undo — that is an ownership decision, and ADR 0008
        makes the owner the tier for exactly this class of action.


        A member who holds `MANAGE_GUILD` and is not the owner gets 403. A non-member still gets 404.
      operationId: deleteGuild
      tags: [guilds]
      responses:
        "204":
          description: The guild and everything under it are gone.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /guilds/{guild_id}/channels:
    parameters:
      - name: guild_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
    get:
      summary: List a guild's channels
      description: >
        In position order. Requires membership.


        **Returns every channel, with no pagination**, deliberately: a client needs the whole tree to render
        a sidebar, so paginating would make it fetch in a loop. The response is bounded by the 500-channel
        ceiling enforced when a channel is created, not by a `limit` the caller passes.


        **Filtered by per-channel view permission.** A channel the caller cannot view is absent rather
        than redacted — its name, topic and category are not information somebody denied it should be able
        to read. Three authorities see everything: an Instance Admin, the guild owner, and any member
        holding `ADMINISTRATOR`.


        Two queries regardless of how many channels the guild has, not two per channel. The caller is
        resolved once at guild level and every channel's overwrites are read in one statement, then
        applied per channel from that single result.
      operationId: listGuildChannels
      tags: [guilds]
      responses:
        "200":
          description: The guild's channels, in position order. An empty guild answers with an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is an API token without the `guilds.read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      summary: Create a channel
      description: >
        Requires `MANAGE_CHANNELS`.


        `type` accepts only the three a guild can contain: `0` text, `2` voice, `4` category. The DM types
        belong to no guild, and the announcement and stage-voice values are reserved in the schema but not
        yet buildable.


        `parent_id`, if given, must name a **category in this guild**. That is checked rather than trusted:
        without it a channel could be nested under a category in a guild the caller has no permissions in,
        which would put its children behind that guild's overwrites. A category cannot be nested inside
        another: the channel list is flat with one level of nesting.


        **An account owns at most 50 guilds**, and a guild holds at most 500 channels. The ceiling is here rather than on the listing because a
        client needs the whole tree to render a sidebar — paginating it would make every client fetch in a
        loop. Bounding creation is what keeps the list response from growing without limit.
      operationId: createGuildChannel
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: The channel, as created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The guild already holds the maximum number of channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /channels/{channel_id}:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
    patch:
      summary: Update a channel
      description: >
        Partial, with `clear_topic` playing the role `clear_description` plays on a guild.


        **This path carries no guild, and that is the point.** The server loads the channel, reads *its*
        `guild_id`, and resolves permissions against that — never against a guild the caller supplied.
        Accepting one in the body and trusting it would let a member holding `MANAGE_CHANNELS` in guild A
        rename a channel in guild B by naming A.


        Requires `MANAGE_CHANNELS` **and `VIEW_CHANNEL`** in the channel itself. A channel you cannot
        see is not yours to manage: the channel listing hides it, and every route that names it answers as
        though it were not there, so the two agree. A DM answers 404 for the same reason — these are
        guild-channel routes and a DM has no guild to resolve against.
      operationId: updateChannel
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: The channel, as updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Delete a channel
      description: >
        Requires `MANAGE_CHANNELS` and `VIEW_CHANNEL` in the channel itself, resolved the same way
        `PATCH` resolves them.


        Deleting a **category** orphans its children to the top level rather than deleting them: losing a
        category must not lose the conversations inside it.
      operationId: deleteChannel
      tags: [guilds]
      responses:
        "204":
          description: The channel is gone.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /guilds/{guild_id}/members/{user_id}/roles/{role_id}:
    parameters:
      - name: guild_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
      - name: role_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
    put:
      summary: Give a member a role
      description: >
        Requires `MANAGE_ROLES`, and three further checks.


        The role must be **strictly below the caller's own highest**, and so must the target — except when
        the target is the caller, which skips only the second comparison. Nobody outranks themselves, so a
        flat rule would make self-assignment impossible for every non-owner and break self-service roles;
        the role check is the one that has to hold on yourself, and it does.


        **The role's permissions must be a subset of the caller's own.** This is the one deliberate
        departure from Discord in this API. Discord gates assignment on hierarchy alone and relies on
        powerful roles being placed high, so a bot role low in the list carrying `MANAGE_GUILD` is a
        misconfiguration rather than a vulnerability there. That is a configuration assumption a public
        instance should not rest on: without this, a moderator holding `MANAGE_ROLES` and not
        `MANAGE_GUILD` assigns such a role to an account they control and has `MANAGE_GUILD` by proxy.


        `@everyone` cannot be assigned — every member holds it by virtue of membership and it is never
        stored as a grant.


        Idempotent: assigning a role the member already holds succeeds.
      operationId: addGuildMemberRole
      tags: [guilds]
      responses:
        "200":
          description: The member, with the roles they now hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The caller lacks `MANAGE_ROLES`, is an API token without `guilds.write`, does not outrank the
            role or the target, or does not hold every permission the role carries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such role in this guild, or no such member of it. A non-member target answers the same as a
            user id that does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The role is `@everyone`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Take a role away from a member
      description: >
        The same checks, and it is checked like an assignment rather than like a cleanup.


        Removing a role reads as a pure demotion and stopped being one when roles gained channel
        overwrites: the commonest use of one is a `muted` role denying `SEND_MESSAGES`, and taking that
        role off somebody lifts the restriction it carried. So the caller must hold whatever the role's
        overwrites touch, in the channels they touch — and the role must be strictly below their own
        highest **including when they are removing it from themselves**, which is why nobody can shed the
        role that establishes their own position.


        Idempotent: removing a role the member does not hold succeeds.
      operationId: removeGuildMemberRole
      tags: [guilds]
      responses:
        "200":
          description: The member, with the roles they now hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: As for `PUT`, including the check over what the role's overwrites carry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The role is `@everyone`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /channels/{channel_id}/permissions/{overwrite_id}:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
      - name: overwrite_id
        in: path
        required: true
        description: >
          The role or member this overwrite targets. Which of the two it is comes from `type` in the body
          — the id alone does not say, and looking it up in both tables would make the answer depend on
          which one happened to hold it.
        schema:
          $ref: "#/components/schemas/Snowflake"
    put:
      summary: Create or replace a channel permission overwrite
      description: >
        ADR 0008 layer 5. Requires `MANAGE_ROLES` and `VIEW_CHANNEL`, both **resolved in this channel**
        rather than at guild level — a caller denied a permission here would otherwise be able to allow it
        back to themselves in one request, and a caller who cannot see the channel would be administering
        one their own listing refuses to mention.


        Three further checks, none of which is the permission check:


        The target must exist **in this guild**, verified against the `type` sent rather than against
        either table. A request naming a role id while claiming a member target is refused rather than
        stored, because the row would be inert and no client could explain it.


        The caller must **outrank the target** — a role strictly below their own highest, or a member
        whose highest role is strictly below it. Naming yourself is exempt from this comparison and from
        nothing else, since nobody outranks themselves and the escalation rule below is what bounds that
        case.


        The caller may only name permissions they themselves hold in this channel, in **either** field.
        Denying is restricted as well as allowing, matching Discord. And the check covers the union of
        what the request *changes*, not what it writes: replacing an existing overwrite with an empty one
        removes whatever it allowed or denied, so those bits are part of the change. Without that,
        blanking a row that denies you something grants it to you.


        Idempotent. An omitted `allow` or `deny` means empty, not "leave alone" — this is a `PUT` and it
        replaces the row it names.
      operationId: setChannelPermissionOverwrite
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOverwriteRequest"
      responses:
        "200":
          description: The overwrite, as written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionOverwrite"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The caller lacks `MANAGE_ROLES` in this channel, is an API token without the `guilds.write`
            scope, does not outrank the target, or named a permission they do not hold here. The message
            names neither the missing permission nor any position — both are a map of the guild's
            configuration handed to somebody probing its edges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The channel is at its ceiling of 50 permission overwrites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Delete a channel permission overwrite
      description: >
        Every check `PUT` makes, including the escalation one — which is the half that looks unnecessary
        and is not. Deleting an overwrite changes exactly the permissions it allowed or denied, so a
        caller who may not name those bits may not remove them.


        Carries a body, unusually for a `DELETE`, because the target is polymorphic and the path id does
        not say which kind it is, and looking it up in both tables would make the answer depend on which
        one happened to hold it. An earlier version of this paragraph justified the body by saying a query
        parameter would land in the request log; it would not, since the logger records the path and never
        the query string.
      operationId: deleteChannelPermissionOverwrite
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOverwriteRequest"
      responses:
        "204":
          description: The overwrite is gone.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            As for `PUT`, including the escalation check over the bits the removed row carried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /guilds/{guild_id}/roles:
    parameters:
      - name: guild_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
    get:
      summary: List a guild's roles
      description: >
        In position order, `@everyone` first. Requires membership.


        Unpaginated for the reason the channel listing is, and bounded the same way — by the 250-role
        ceiling enforced at creation.
      operationId: listGuildRoles
      tags: [guilds]
      responses:
        "200":
          description: The guild's roles, in position order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is an API token without the `guilds.read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      summary: Create a role
      description: >
        Requires `MANAGE_ROLES`, **and refuses to grant a permission the caller does not hold**.


        **The new role is created at the bottom of the hierarchy**, immediately above `@everyone`, and
        every other role shifts up one. Created at the top it would be a role its own creator could not
        then edit, delete, assign or reposition, since all four require the role to be strictly below the
        caller's own highest — a dead end reachable on a moderator's first use of this endpoint.


        That second half is not a nicety. Without it `MANAGE_ROLES` is every permission: create a role
        carrying `ADMINISTRATOR`, assign it to yourself, and the hierarchy is gone. An owner and an
        administrator pass it trivially because they hold everything; an Instance Admin passes above the
        guild entirely.


      operationId: createGuildRole
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: The role, as created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The caller lacks `MANAGE_ROLES`, or asked for permissions they do not themselves hold. One
            answer for both, and it names no permission bit: reporting which one was refused tells a caller
            probing the boundary exactly where it is, and they can already read their own from the role
            listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The guild already holds the maximum number of roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

    patch:
      summary: Reorder a guild's roles
      description: >
        A bulk rearrangement, and it is bulk because reordering is a multi-row swap. Moving a role from 2
        to 5 means moving whatever sits at 3, 4 and 5 as well; done as separate requests there is a window
        between each where two roles share a position, and two roles at one position are neither above nor
        below each other — which dissolves the comparison every permission check here rests on. One
        request, one transaction, one lock.


        Requires `MANAGE_ROLES`. **Both the current and the requested position of every role named must be
        strictly below the caller's own highest.** Checking only the destination is not enough: a caller
        could name a role above them and move it below them, and from there edit, delete or assign it.


        The resulting arrangement must leave no two non-default roles at the same position, checked
        against the roles the request does not mention as well as within it. `@everyone` cannot be moved,
        and nothing else may take position 0 — it is `@everyone`'s, and a role sharing the floor confers
        no standing on whoever holds it. Positions run from 1 to the instance's role ceiling.
      operationId: reorderGuildRoles
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRolesRequest"
      responses:
        "200":
          description: The guild's roles, in their new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The caller lacks `MANAGE_ROLES`, is an API token without `guilds.write`, or named a role at or
            above their own highest — at either end of the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            The result would put two roles at the same position, or the request names `@everyone`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /guilds/{guild_id}/roles/{role_id}:
    parameters:
      - name: guild_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
      - name: role_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
    patch:
      summary: Update a role
      description: >
        Partial. Requires `MANAGE_ROLES`, **and that the role be strictly below the caller's own highest**
        — the escalation rule bounds which permissions may be granted and says nothing about which role
        may be given them, so without the position check a moderator could edit the administrator role.


        Also the same refusal to grant permissions the caller does not
        hold.


        `@everyone` may have its **permissions** edited — that is how a guild sets its floor — but not its
        name. Renaming it would leave every client's `@everyone` label pointing at a role that no longer
        says so, and the mention syntax is keyed off the name.


        `position` is absent from the request body on purpose; see `POST` above.
      operationId: updateGuildRole
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: The role, as updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            An attempt to rename `@everyone`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Delete a role
      description: >
        Requires `MANAGE_ROLES`. Members holding the role simply stop holding it.


        `@everyone` cannot be deleted: a guild without a default role has no permission floor for
        resolution to start from. The refusal lives in the `DELETE` statement itself rather than in a check
        before it, so two concurrent requests cannot slip past it.
      operationId: deleteGuildRole
      tags: [guilds]
      responses:
        "204":
          description: The role is gone.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An attempt to delete `@everyone`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

  /guilds/{guild_id}/audit-log:
    parameters:
      - name: guild_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
    get:
      summary: Read a guild's audit log
      description: >
        Every guild-scoped mutation writes an entry here, in the same transaction as the mutation itself,
        so the log cannot disagree with what happened. Newest first.


        Requires `VIEW_AUDIT_LOG`, which is its own permission bit and is **not** implied by
        `MANAGE_GUILD`. A non-member gets 404 and a member without the bit gets 403 — they already know
        the guild exists, so naming it discloses nothing.


        **Entries are not filtered by what the reader can currently see.** A channel hidden from you by a
        permission overwrite still appears here by id, and by name in `changes`. That is deliberate: half
        the interesting entries are deletions whose target no longer exists and cannot be resolved to a
        permission at all, and whether a channel is visible *today* is not the question an audit log
        answers about an action taken last month — filtering on it would let somebody hide their tracks
        after the fact by locking a channel down. The permission is the boundary, so granting
        `VIEW_AUDIT_LOG` is granting sight of every moderation action in the guild.


        Cursor-paginated on the entry `id`, never offset, and never on `created_at`: nothing constrains
        `created_at` to be unique, so a cursor over it would skip or repeat an entry at any page boundary
        landing inside a group of equal values. Ids are snowflakes and therefore time-ordered, so ordering
        by id *is* ordering by time, and the id is unique by construction.


        Page through by passing the last `id` you received as `before`. The response is a bare array — a
        page is exhausted when it comes back shorter than `limit`.


        Ids are not resolved to the objects they name. `target_id` is returned as an id whatever it
        points at, because half of these entries describe something that no longer exists.
      operationId: listGuildAuditLog
      tags: [guilds]
      parameters:
        - name: before
          in: query
          required: false
          description: Resume before this entry id, exclusive. Omit for the newest page.
          schema:
            $ref: "#/components/schemas/Snowflake"
        - name: action
          in: query
          required: false
          description: >
            Return only entries with this action. An action this instance does not write is a 400 rather
            than an empty page — a query matching nothing is indistinguishable from a guild that has taken
            no such action, so a typo would read as evidence.
          schema:
            $ref: "#/components/schemas/AuditLogAction"
        - name: actor_id
          in: query
          required: false
          description: Return only entries whose actor is this user.
          schema:
            $ref: "#/components/schemas/Snowflake"
        - name: limit
          in: query
          required: false
          description: >
            Page size. Defaults to 50, and values above 100 are clamped rather than refused, as on the
            member listing.
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: A page of audit log entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            The caller is a member without `VIEW_AUDIT_LOG`, or an API token without the `guilds.read`
            scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /guilds/{guild_id}/members:
    parameters:
      - name: guild_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
    get:
      summary: List a guild's members
      description: >
        Cursor-paginated on `user_id`, never offset. An offset makes page N cost N pages of scanning and
        shifts every row when somebody joins or leaves mid-read; a cursor costs one index descent whatever
        the depth and is stable under concurrent writes.


        Page through by passing the last `user_id` you received as `after`. The response is a bare array —
        a page is exhausted when it comes back shorter than `limit`.
      operationId: listGuildMembers
      tags: [guilds]
      parameters:
        - name: after
          in: query
          required: false
          description: Resume after this user id, exclusive. Omit for the first page.
          schema:
            $ref: "#/components/schemas/Snowflake"
        - name: limit
          in: query
          required: false
          description: >
            Page size. Defaults to 50, and values above 100 are **clamped rather than refused** — a client
            asking for more than the ceiling is not making an error worth failing a request over, and
            returning the ceiling communicates it more clearly than a 400 it has to parse.
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: A page of members, ascending by user id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The credential is an API token without the `guilds.read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /guilds/{guild_id}/members/{user_id}:
    parameters:
      - name: guild_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Snowflake"
    patch:
      summary: Update a member
      description: >
        **The required permission depends on which fields are sent.** `nickname` needs `MANAGE_GUILD`;
        `mute` additionally needs `MUTE_MEMBERS` and `deaf` additionally needs `DEAFEN_MEMBERS`. Collapsing
        them into one permission would let anybody who can rename people also silence them.


        `mute` and `deaf` are the server-side, moderator-set values. They are distinct from the self-mute
        and self-deafen a client sets on itself, which live in voice state rather than here.


        **The caller must also outrank the target** — the target's highest role strictly below the
        caller's own. Holding the permission is not the same as outranking the person, and without this a
        `MUTE_MEMBERS` holder could silence an administrator.


        One exception: setting **your own** nickname skips the comparison, since nobody outranks
        themselves and the alternative is that no member can rename themselves at all. It applies to the
        nickname alone — clearing your own server-mute would undo the moderation the bit exists for.
      operationId: updateGuildMember
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: >
            The member, as updated. `roles` is empty here rather than populated — this response reports the
            row that was written, and role membership is not among the fields it writes. Read the member
            listing for a member's roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      summary: Remove a member, or leave
      description: >
        Removing somebody else requires `KICK_MEMBERS` **and outranking them** — their highest role
        strictly below the caller's own. Holding the permission is not the same as outranking the person.


        Removing **yourself** is leaving, and requires no permission beyond being a member — nobody should
        need a moderation bit to walk out of a room. It is the one self-action exempt from the hierarchy
        entirely, and not because it is a demotion: removing a role looks like one too and stopped being
        one when roles gained channel overwrites. Leaving forfeits every permission in the guild at once,
        so it cannot be a route to gaining one.


        Both write an audit entry, because "who left" is exactly what that log is read for.


        The **owner cannot be removed by either route**, including by themselves: the owner is the tier
        that bypasses permission checks within a guild, and a guild whose owner is not a member has no such
        tier at all. Transferring ownership is what makes this reachable, and it does not exist yet.
      operationId: removeGuildMember
      tags: [guilds]
      responses:
        "204":
          description: The member is no longer in the guild.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An attempt to remove the guild owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        `Authorization: Bearer <credential>`, where the credential is one of two kinds and the server tells
        them apart by prefix:


        A **JWT access token** from `/auth/login` or `/auth/refresh` — HS256, 15-minute TTL, verified
        without a database round trip. It represents the person, so it passes every scope check
        (docs/adr/0022-access-token-signing-and-scope-model.md).


        An **API token** (`nat_…`) from `/auth/tokens` — long-lived, restricted to the scopes it was granted,
        and revocable instantly.


        Refresh tokens (`nrt_…`) are **not** Bearer credentials. They go in the body of `/auth/refresh` and
        `/auth/logout` and authenticate nothing else.

    operatorToken:
      type: http
      scheme: bearer
      description: >
        `Authorization: Bearer <operator token>` — the credential that authorizes instance administration
        before any account exists, and the only one in this system minted by a client rather than by the
        server.


        It is an HS256 JWT signed with the instance's own signing key (`[auth].jwt_secret`, or
        `NORITE_JWT_SECRET`), carrying `iss: "norite"`, `typ: "operator"`, an `exp`, and **no subject** — an
        operator is not an account. A token carrying a subject is refused, as is one with any other `typ`:
        without that check a device entry token would qualify, since it also names no account and carries
        the same issuer and key.


        What it proves is possession of the instance's configuration file, which is why it is the right
        authority for creating the first administrator and the wrong one for anything an account can do. It
        is not revocable — there is no row to delete — so it lives **two minutes** and is minted per
        request. `norite instance bootstrap` builds one; the shared definition is Go package
        `backend/operatortoken`, which both the server and the CLI import.

  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      description: >
        Which identity provider. Only names this build implements *and* this instance has configured are
        accepted; anything else is a 404, so an unconfigured provider is indistinguishable from one that
        does not exist.
      schema:
        type: string
        enum: [google, github]

  schemas:
    InstanceMeta:
      type: object
      description: >
        The AGPL-3.0 section 13 source offer. Every field is present on every response; none is nullable.
      required: [license, source_url, source_revision]
      properties:
        license:
          type: string
          description: >
            The SPDX identifier this instance's own code is distributed under. Not configurable — an
            operator may modify Norite and must then offer their modified source, but the terms they
            received it under are not theirs to restate.
          examples: ["AGPL-3.0-or-later"]
        source_url:
          type: string
          format: uri
          description: >
            Where this instance's Corresponding Source can be obtained. Defaults to the upstream
            repository; a modified instance must set it to its own.
          examples: ["https://github.com/Alexnex31/Norite"]
        source_revision:
          type: string
          description: >
            The git revision the running binary was built from, or `unknown` for a build that was not
            stamped at link time.
          examples: ["v1.0.0", "9bb85f0", "unknown"]

    Snowflake:
      type: string
      pattern: "^[0-9]+$"
      description: >
        A Snowflake ID as a decimal string. Always a string, never a JSON number — Snowflakes exceed 2^53,
        so numeric parsing silently loses precision (docs/adr/0003-snowflake-ids.md).
      examples: ["7238829238972837423"]

    Scope:
      type: string
      description: >
        A capability an API token may be granted. Scopes only restrict a delegated credential below its
        owner's reach; they never grant. The vocabulary grows with the surface it guards.


        There is deliberately no scope for managing API tokens: minting, listing and revoking all require a
        logged-in user, because a credential that can create credentials can escalate itself.


        `guilds.read` and `guilds.write` are separate rather than one `guilds` scope, because the two have
        very different blast radii and the common bot wants only the first — a status bot that lists
        channels should not be one compromise away from deleting the guild. **Write does not imply read**:
        a scope bounds a delegated credential, and holding one is not a reason to be granted another, so a
        token that needs both asks for both.
      enum: [identify, guilds.read, guilds.write]

    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, starting, stopping, degraded]
          description: >
            Readiness state: `ok` is serving; `starting` is up but not finished booting (migrations may
            still be running); `stopping` is draining during shutdown; `degraded` is past startup but
            currently unable to reach the database.
        detail:
          type: string
          description: Operator-facing explanation of a non-ok status. Omitted when status is `ok`.

    User:
      description: >
        An account. Never carries `password_hash` or any other credential material — this shape is built
        field-by-field from the database row rather than serialised from it, so a column added later cannot
        leak onto the wire by default.
      type: object
      required: [id, username, email, display_name, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        username:
          type: string
          description: Unique, case-insensitively.
        email:
          type: string
          format: email
          description: Unique, case-insensitively.
        display_name:
          type: string
        avatar_hash:
          type: [string, "null"]
        email_verified_at:
          type: [string, "null"]
          format: date-time
          description: Null while the address is unconfirmed. Set when a confirmation link is followed (M10), when a provider
            vouched for the address, or on creation for an account made by `/instance/bootstrap` or on an
            instance with no mail relay. An account with this null cannot sign in.
        created_at:
          type: string
          format: date-time
        two_factor_enabled:
          type: boolean
          description: >
            True only for a *confirmed* enrollment. An enrollment somebody started and abandoned is not a
            factor and must not read as one, or the account looks protected when it is not.
        recovery_codes_remaining:
          type: [integer, "null"]
          format: int64
          description: >
            How many unspent recovery codes the account has. Null rather than zero when there is no factor
            at all — zero would read as "you have run out" rather than "there is nothing to run out of".

    RevocationCounts:
      description: >
        What one call to the revocation primitive removed. Shared by `POST /auth/logout/all` and
        `DELETE /auth/2fa/totp`, which revoke exactly the same set — one schema for one server-side value,
        so that when M18 adds force-closed gateway connections and M101 adds E2E device trust, the count
        arrives in both places at once rather than in whichever was remembered.
      type: object
      required:
        - sessions_revoked
        - api_tokens_revoked
        - oauth_exchange_codes_revoked
        - device_authorizations_revoked
      additionalProperties: false
      properties:
        sessions_revoked:
          type: integer
          format: int64
          description: Session records revoked, across every device but this one.
        api_tokens_revoked:
          type: integer
          format: int64
          description: >
            API tokens revoked. Reported separately because it is the count a person needs to see to
            understand why a bot stopped.
        oauth_exchange_codes_revoked:
          type: integer
          format: int64
          description: Outstanding OAuth exchange codes cancelled. Usually zero.
        device_authorizations_revoked:
          type: integer
          format: int64
          description: >
            Device sign-ins that had been approved but not yet collected. Worth surfacing: somebody who
            approved a sign-in on a shared machine and then reached for this has just cancelled it, and
            nothing else would tell them.

    RecoveryCodes:
      description: >
        A fresh set of single-use recovery codes. Returned by confirmation and by regeneration, and shown
        exactly once — they are stored only as hashes, so nothing recoverable from the database can be
        presented as one (rule 8).
      type: object
      required: [recovery_codes]
      additionalProperties: false
      properties:
        recovery_codes:
          type: array
          items:
            type: string

    TwoFactorChallenge:
      description: >
        The `202` a sign-in gets when the account owes a second factor. Not a credential: presenting one
        without a valid code produces exactly the refusal a wrong password does. What it removes is the need
        to send the password twice.


        `two_factor_required` is constant true and is present anyway, so a client reading a body without
        looking at the status still cannot mistake this for a token pair.
      type: object
      required: [two_factor_required, challenge, expires_at]
      additionalProperties: false
      properties:
        two_factor_required:
          type: boolean
        challenge:
          type: string
        expires_at:
          type: string
          format: date-time

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_at]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: >
            A JWT, presented as `Authorization: Bearer …`. Short-lived by design: revocation acts on the
            refresh session, so a stolen access token stays usable until it expires and the TTL is what
            bounds that window.
        refresh_token:
          type: string
          description: >
            An opaque `nrt_…` value, stored server-side only as a SHA-256 hash. Send it to `/auth/refresh`
            or `/auth/logout`; it is never a Bearer credential. Single-use — each refresh returns a new one,
            and presenting a spent one revokes the device's whole family.
          examples: ["nrt_kZ8m1H0dQ2s7pXv4b9RtLcYwJfN6aE3gUiOoPqSdTbA"]
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
          description: >
            When the **access** token expires, not the refresh token. Clients refresh on this.

    Session:
      description: >
        One device signed in to an account. A device, not a session record: the underlying rows rotate on
        every refresh, and `id` names whichever record is newest and live for that device right now.
      type: object
      required: [id, device_name, ip_address, first_seen, last_used_at, expires_at, current]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        device_name:
          type: string
          description: >
            What the client called this machine at sign-in, or empty if it did not say. **Client-supplied
            and untrusted** — sanitize before rendering it anywhere (CLAUDE.md rule 19). Sent as given
            rather than cleaned here, because cleaning it server-side would corrupt the value for every
            other consumer.
        ip_address:
          type: [string, "null"]
          description: >
            Where this device was last seen from. Null for a session with no recorded address; present and
            explicitly null rather than omitted, so a caller reads the same keys either way.
        first_seen:
          type: string
          format: date-time
          description: >
            When this device first signed in, across the whole rotation family — **not** when it last
            rotated, which on an active device is at most fifteen minutes ago and would be useless.
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the current record expires if the device never refreshes again.
        current:
          type: boolean
          description: >
            True for the device that made this request. Determined by the access token's `sid` claim
            resolved to its device, so it stays correct across the caller's own rotations.

    ApiToken:
      description: A scoped API token's metadata. Never includes the token value or its hash.
      type: object
      required: [id, name, scopes, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        name:
          type: string
          description: Human label chosen at mint time, so a token can be recognised later in order to revoke it.
          maxLength: 100
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: >
            Null until first use. Updated at most once every few minutes per token, not per request — see
            the listing endpoint's description.

    MintedApiToken:
      description: >
        A newly-created API token, including its value. This is the only response that ever contains it.


        Spelled out in full rather than composed over `ApiToken` with `allOf`, which is what it used to do
        and which made it **unsatisfiable**: `allOf` branches are validated independently, so `ApiToken`'s
        `additionalProperties: false` rejected the very `value` the second branch required. No real
        response could match, and a validating client would have refused every successful mint — of a
        credential that cannot be recovered. Nothing caught it because the contract test compares the set
        of routes, not payloads. If a field is added to `ApiToken`, add it here too; the test named below
        fails until you do.
      type: object
      required: [id, name, scopes, created_at, value]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        name:
          type: string
          description: Human label chosen at mint time, so a token can be recognised later in order to revoke it.
          maxLength: 100
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Null on a token that has just been minted. See `ApiToken`.
        value:
          type: string
          description: >
            The credential itself, `nat_…`. Stored only as a SHA-256 hash and **not recoverable** — if
            it is lost, mint a new token and revoke this one. The `nat_` prefix exists so a leaked
            credential is identifiable on sight, by a human or a secret scanner.
          examples: ["nat_9pQ2xL7vD4mZ0kR8sT1yWbGhJcNfEuAiOoPdXrVtYnM"]

    OAuthExchangeRequest:
      type: object
      required: [code, flow_verifier, device_id]
      additionalProperties: false
      properties:
        code:
          type: string
          description: The one-time code from the callback. Single-use, and valid for minutes.
        flow_verifier:
          type: string
          pattern: "^nof_[A-Za-z0-9_-]{43}$"
          description: >
            The secret whose SHA-256 was sent as `flow_challenge` when this flow was started — the full
            `nof_`-prefixed string, not the bytes inside it. See `/auth/oauth/{provider}/authorize` for how
            the pair is constructed.


            Required: it is what makes the code redeemable by the client that began the sign-in and by
            nobody else, so a code obtained from a link somebody else crafted is worthless.


            A mismatch is answered exactly as an unknown or expired code, and spends the code either way.
        device_id:
          type: string
          maxLength: 128
          description: >
            Stable per client install. Scopes the refresh-token family, exactly as at login: rotation and
            reuse detection act within one device_id and never across them.
        device_name:
          type: string
          maxLength: 64

    OAuthCompleteRequest:
      type: object
      required: [signup_token, username]
      additionalProperties: false
      properties:
        signup_token:
          type: string
          description: >
            From the callback. Carries the provider-verified identity until a username is chosen; it is
            not a Bearer credential and authenticates nothing else.
        username:
          type: string
          minLength: 2
          maxLength: 32
          description: Same rule as registration — see RegisterRequest.

    OAuthExchangeCode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Trade at `/auth/oauth/exchange` for a token pair.

    DeviceCodeRequest:
      type: object
      required: [device_id]
      additionalProperties: false
      properties:
        device_id:
          type: string
          maxLength: 128
          description: >
            Stable per client install, and supplied here rather than at poll time because it is what the
            resulting session is scoped to — the browser that approves has no idea what it is. Rotation and
            reuse detection act within one device_id and never across them.
        device_name:
          type: string
          maxLength: 64
          description: >
            What this machine is called in the account's session list. Also shown on the verification page,
            so a person can see which device they are about to authorize. Bounded and escaped there; it is
            the client's own string, so a page presents it as one.

    DeviceCodeResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      additionalProperties: false
      properties:
        device_code:
          type: string
          pattern: "^nod_[A-Za-z0-9_-]{43}$"
          description: >
            The credential half. Trades for a token pair at `/auth/device/token` and must never be
            displayed, logged, or written anywhere a person could read it back.
        user_code:
          type: string
          pattern: "^[BCDFGHJKMNPQRSTVWXYZ]{4}-[BCDFGHJKMNPQRSTVWXYZ]{4}$"
          description: >
            The half to show. Eight characters from a twenty-character alphabet — A-Z minus the vowels, so
            a draw does not spell anything, and minus `L`, which is misread as `1` or `I`; there are no
            digits at all, so `0` and `O` never meet. The dash is presentation only and the instance
            accepts the code with or without it, in any case.


            Display it verbatim. A client that re-cases or re-groups it is showing something other than
            what the instance issued.
        verification_uri:
          type: string
          format: uri
          description: >
            Where to send the person. Absolute, and always on this instance's own origin — a client should
            check that before printing it, since it is a URL somebody is about to visit and type
            credentials into.
        expires_in:
          type: integer
          description: Seconds until both codes stop working. 1200 on this instance.
        interval:
          type: integer
          description: >
            Minimum seconds between polls. 5 on this instance. Read it rather than assuming it — see the
            endpoint description.

    DeviceTokenRequest:
      type: object
      required: [device_code]
      additionalProperties: false
      properties:
        device_code:
          type: string
          description: The `device_code` from `/auth/device/code`, verbatim.

    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    PasswordResetConfirmRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token:
          type: string
          description: >
            The token from the reset email. Single-use, and valid for one hour from when it was issued.
        new_password:
          type: string
          minLength: 12
          maxLength: 256
          description: Same rules as registration — length only, counted in characters.

    BootstrapRequest:
      type: object
      required: [username, email, password]
      additionalProperties: false
      description: >
        The first administrator's account. The same fields and the same bounds as RegisterRequest, and they
        must stay the same: both create rows in one table under one set of constraints, so a value one
        accepts and the other rejects is a difference with nothing behind it.
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 256
        display_name:
          type: string
          maxLength: 64

    CreateInviteRequest:
      type: object
      additionalProperties: false
      description: Both fields are optional, and omitting either means "no limit".
      properties:
        max_uses:
          type: integer
          minimum: 1
          maximum: 10000
          description: How many accounts may be created with this code. Omit for unlimited.
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 31536000
          description: >
            Lifetime from now. Omit for an invite that never expires. Capped at a year — a longer-lived
            invite is almost always a mistake, and a permanent one is spelled by omitting the field rather
            than by a number nobody meant to type.

    InstanceInvite:
      type: object
      required: [code, uses, created_at]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >
            Sixteen characters from `BCDFGHJKMNPQRSTVWXYZ`, about 69 bits. Returned in full to an
            administrator, and stored in plaintext, which is a deliberate exception to this project's
            hash-everything rule: an invite exists to be handed to somebody, so it must be readable back,
            and what it authorizes is bounded — presenting one lets an account be created subject to every
            other rule registration enforces, and reaches no existing account or data.
        created_by:
          description: >
            Who issued it, or `null` when the instance operator did — the operator is not an account and
            has no id to record.
          oneOf:
            - $ref: "#/components/schemas/Snowflake"
            - type: "null"
        max_uses:
          description: How many uses it allows, or `null` for unlimited.
          oneOf:
            - type: integer
            - type: "null"
        uses:
          type: integer
          description: How many accounts have been created with it.
        expires_at:
          description: When it stops working, or `null` if it never does.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [username, email, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
          description: >
            Letters and digits in any script, plus `_`, `.` and `-`. An allow-list rather than a list of
            forbidden characters, so control codes, terminal escapes, bidirectional overrides and the
            various invisible spaces are all excluded without having to enumerate them. Emoji and other
            symbols are excluded too — `display_name` is the free-form field.

            Length is counted in characters, not bytes, so a name in a non-Latin script is not penalised.

            Normalised to NFKC before the uniqueness check, so two names that render identically cannot
            become two accounts: `ﬁnn` and `finn` are the same username. Unique case-insensitively.
            Normalisation happens before the length check, which a client submitting compatibility
            characters may notice — a 32-character name can normalise to something longer and be rejected.
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: >
            Length is the only rule, counted in characters rather than bytes so a passphrase in a non-Latin
            script is not penalised. No composition requirements: they push people toward predictable
            substitutions while ruling out strong passphrases. The ceiling exists to bound hashing work.
        challenge_response:
          type: string
          maxLength: 4096
          description: >
            **Reserved for M67a and ignored by every instance today.** Nothing emits a challenge yet, so
            sending this changes nothing and omitting it is correct — and it is *accepted*: the request
            decoder rejects unknown fields, so a reserved field the server does not name is a 400 rather
            than a no-op. It was exactly that until a review sent one.


            When M67a lands this carries the solved challenge — a proof-of-work solution, a hosted-captcha
            token, or whatever the mechanism chosen at build time produces. Opaque to this contract on
            purpose: the field is a carrier, and pinning its internal shape here would make swapping the
            mechanism a contract change across four clients, which is exactly what reserving it is meant to
            avoid.


            The ceiling is generous because a captcha provider's token is the largest plausible value and
            they are not small. It exists so an unbounded body cannot be posted at an unauthenticated
            endpoint, not because 4096 means anything.
        invite_code:
          type: string
          maxLength: 64
          description: >
            Required while the instance is configured for invite-only registration, ignored while it is
            open. Sixteen characters drawn from `BCDFGHJKMNPQRSTVWXYZ` — no vowels, so a code is unlikely
            to spell anything, and no `L`, which is the third member of the `1`/`I`/`L` group that gets
            misread. Case, spaces and dashes are normalised away before lookup, so a code may be presented
            however it was pasted.

            The maximum here is deliberately looser than the code's own length: what a code may contain is
            the instance's decision, and a bound that disagreed with it would refuse a valid code for the
            wrong reason.
        display_name:
          type: string
          maxLength: 64
          description: Defaults to the username when omitted.

    LoginRequest:
      type: object
      required: [email, password, device_id]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
        device_id:
          type: string
          maxLength: 128
          description: >
            Stable identifier for this installation — the daemon generates one per install and reuses it.
            Scopes the refresh-token family; see the endpoint description for why it is required.
        device_name:
          type: string
          maxLength: 64
          description: Human label shown in a future session listing (M11). Optional.

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string

    MintApiTokenRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
          description: >
            Must be non-empty and every entry must be recognised. A token with no scopes could do nothing,
            and an unrecognised scope is rejected rather than dropped.

    Permissions:
      type: string
      pattern: "^[0-9]+$"
      description: >
        A permission bitfield, as a **decimal string** rather than a number.


        The same decision snowflake ids take, for the same reason: this is a 63-bit value and JavaScript's
        number type is a float64, so anything above 2^53 loses precision silently in a browser. Twenty
        bits are defined today, so the hazard is years away — which is exactly why the representation is
        fixed now, while changing it costs nothing.


        Bit positions, low to high: `VIEW_CHANNEL`, `SEND_MESSAGES`, `MANAGE_MESSAGES`, `MANAGE_CHANNELS`,
        `MANAGE_ROLES`, `KICK_MEMBERS`, `BAN_MEMBERS`, `CREATE_INVITE`, `MANAGE_GUILD`, `ADMINISTRATOR`,
        `CONNECT_VOICE`, `SPEAK_VOICE`, `VIDEO_VOICE`, `MUTE_MEMBERS`, `DEAFEN_MEMBERS`,
        `MENTION_EVERYONE`, `MANAGE_WEBHOOKS`, `MANAGE_EMOJIS`, `MODERATE_MEMBERS`, `VIEW_AUDIT_LOG`.


        **The order is data, not documentation.** What the database stores is bit positions, so
        renumbering reassigns every permission every guild has already granted. `VIDEO_VOICE` is reserved
        and granted by nothing; it is listed because removing it would renumber the six bits above it.
      examples: ["3075", "0"]

    Guild:
      type: object
      required: [id, name, owner_id, icon_hash, description, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        name:
          type: string
        owner_id:
          allOf:
            - $ref: "#/components/schemas/Snowflake"
          description: >
            The account that bypasses every permission check within this guild (authority layer 2). Cannot
            be removed from the guild, and transferring it is not yet possible.
        icon_hash:
          type: [string, "null"]
          description: Reserved. No upload endpoint exists yet, so this is always null.
        description:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGuildRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1024

    UpdateGuildRequest:
      type: object
      additionalProperties: false
      description: >
        Every field optional; an absent one is left alone. At least conceptually a caller sends only what
        it means to change.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1024
        clear_description:
          type: boolean
          default: false
          description: >
            Removes the description. A separate flag rather than a null `description`, because a JSON
            decoder cannot tell an explicit null from an absent field — and if absent meant "clear", every
            partial update would erase what it did not mention.

    Channel:
      type: object
      required:
        [id, guild_id, type, parent_id, name, topic, position, nsfw, last_message_id, bitrate, user_limit,
         created_at, updated_at, permission_overwrites]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        permission_overwrites:
          type: array
          description: >
            Every overwrite configured on this channel — as configured, not as resolved for the caller.


            Required and never null, on every route that returns a channel. An omitted array and an empty
            one would be one schema meaning two things depending on which route produced it, and a client
            refreshing its cache from a response is entitled to read this as the whole truth.


            Present on the listing because a permission editor cannot be drawn without it and there is no
            single-channel `GET` to ask instead. The listing already reads every channel in the guild, so
            one further query answers the whole sidebar rather than one request per tab opened.
          items:
            $ref: "#/components/schemas/PermissionOverwrite"
        guild_id:
          oneOf:
            - $ref: "#/components/schemas/Snowflake"
            - type: "null"
          description: Null for a DM or group DM, which belong to no guild.
        type:
          type: integer
          description: >
            `0` text, `1` DM, `2` voice, `3` group DM, `4` category, `5` announcement (reserved), `6` stage
            voice (reserved), `7` public matchmaking.


            Only `0`, `2` and `4` can be created through the guild-channel endpoint. The reserved values
            are part of the schema and stay there; voice is active v1 functionality, video and stage voice
            are the deferred-but-seamed parts.
        parent_id:
          oneOf:
            - $ref: "#/components/schemas/Snowflake"
            - type: "null"
          description: >
            The category this channel sits under. Deleting a category sets this to null on its children
            rather than deleting them — losing a category must not lose the conversations in it.
        name:
          type: [string, "null"]
        topic:
          type: [string, "null"]
        position:
          type: integer
        nsfw:
          type: boolean
        last_message_id:
          oneOf:
            - $ref: "#/components/schemas/Snowflake"
            - type: "null"
          description: Reserved until messages exist. Always null at this version.
        bitrate:
          type: [integer, "null"]
          description: Voice channels only; null on every other type.
        user_limit:
          type: [integer, "null"]
          description: Voice channels only; null on every other type.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateChannelRequest:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: integer
          enum: [0, 2, 4]
          description: Text, voice, or category. See `Channel.type` for the values a guild cannot contain.
        topic:
          type: string
          maxLength: 1024
        parent_id:
          allOf:
            - $ref: "#/components/schemas/Snowflake"
          description: >
            A category **in this guild**. Verified rather than trusted: nesting under a category elsewhere
            would place this channel behind another guild's overwrites.
        position:
          type: integer
          default: 0
        nsfw:
          type: boolean
          default: false
        bitrate:
          type: integer
          minimum: 8000
          maximum: 384000
        user_limit:
          type: integer
          minimum: 0
          maximum: 99

    UpdateChannelRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        topic:
          type: string
          maxLength: 1024
        clear_topic:
          type: boolean
          default: false
          description: Removes the topic. See `clear_description` on a guild for why this is a flag.
        position:
          type: integer
        nsfw:
          type: boolean
        bitrate:
          type: integer
          minimum: 8000
          maximum: 384000
        user_limit:
          type: integer
          minimum: 0
          maximum: 99

    ReorderRolesRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 250
          description: >
            The roles to move and where. Roles not named keep their position — but are still checked, since
            the resulting arrangement must not collide with them. Capped at 250 entries, which is
            the *default* role ceiling — an instance configured with a higher one reorders in batches. The
            cap is a fixed transport bound; the range each `position` must fall in tracks the instance's
            actual ceiling.
          items:
            type: object
            additionalProperties: false
            required: [id, position]
            properties:
              id:
                $ref: "#/components/schemas/Snowflake"
              position:
                type: integer
                format: int32
                minimum: 1
                description: >
                  From 1 to the instance's role ceiling. Zero is `@everyone`'s and is refused — a client
                  sending zero-based positions is the ordinary way in, since role lists render 0-indexed.

    PermissionOverwrite:
      type: object
      description: >
        One channel permission overwrite — ADR 0008 layer 5.


        `target_id` is polymorphic: a role id when `type` is 0, a user id when it is 1. It carries no
        foreign key for that reason, which is why deleting a role or removing a member deletes their
        overwrites explicitly rather than leaving the database to cascade.
      additionalProperties: false
      required: [channel_id, type, target_id, allow, deny]
      properties:
        channel_id:
          $ref: "#/components/schemas/Snowflake"
        type:
          type: integer
          format: int32
          enum: [0, 1]
          description: 0 role, 1 member.
        target_id:
          $ref: "#/components/schemas/Snowflake"
        allow:
          $ref: "#/components/schemas/Permissions"
        deny:
          $ref: "#/components/schemas/Permissions"

    SetOverwriteRequest:
      type: object
      description: >
        A replacement, not a patch. An omitted `allow` or `deny` means empty — there is no way to change
        one and leave the other, because the row is written whole.
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: integer
          format: int32
          enum: [0, 1]
          description: >
            Which kind of thing `overwrite_id` names. Required, and validated rather than stored: a value
            the resolver would ignore is refused, so the table cannot accumulate rows that resolve to
            nothing and that no cleanup path knows about.
        allow:
          $ref: "#/components/schemas/Permissions"
        deny:
          $ref: "#/components/schemas/Permissions"

    DeleteOverwriteRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: integer
          format: int32
          enum: [0, 1]
          description: Which kind of thing `overwrite_id` names.

    Role:
      type: object
      required:
        [id, guild_id, name, color, permissions, position, hoist, mentionable, is_default, created_at,
         updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        guild_id:
          $ref: "#/components/schemas/Snowflake"
        name:
          type: string
        color:
          type: integer
          minimum: 0
          maximum: 16777215
          description: 24-bit RGB. `0` means no colour, which renders as inherited rather than as black.
        permissions:
          $ref: "#/components/schemas/Permissions"
        position:
          type: integer
          description: >
            Higher is higher in the hierarchy. `@everyone` is always 0. Not settable through these
            endpoints — reordering is a multi-row operation, and role hierarchy arrives with the
            permission-overwrite endpoints.
        hoist:
          type: boolean
          description: Whether members holding this role are shown in their own section of the member list.
        mentionable:
          type: boolean
        is_default:
          type: boolean
          description: >
            True for exactly one role per guild, `@everyone`. It is the floor every other role stacks on,
            it cannot be deleted or renamed, and every member holds it without appearing in any grant.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: integer
          minimum: 0
          maximum: 16777215
          default: 0
        permissions:
          allOf:
            - $ref: "#/components/schemas/Permissions"
          description: >
            Defaults to none. **Cannot exceed what the caller holds** — see the endpoint description for
            why that check is what stops `MANAGE_ROLES` from being every permission.
        hoist:
          type: boolean
          default: false
        mentionable:
          type: boolean
          default: false

    UpdateRoleRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Refused for `@everyone`.
        color:
          type: integer
          minimum: 0
          maximum: 16777215
        permissions:
          allOf:
            - $ref: "#/components/schemas/Permissions"
          description: Cannot exceed what the caller holds. Permitted on `@everyone`, unlike the name.
        hoist:
          type: boolean
        mentionable:
          type: boolean

    AuditLogAction:
      type: string
      description: >
        What an audit log entry records. A closed vocabulary owned by this codebase, `domain.verb`, and a
        stable string rather than a Postgres enum so that adding one is not a migration.


        `role.reorder` is one entry for a whole rearrangement rather than one per row moved: the operation
        is a single atomic change, and splitting it would make an operator reconstruct which entries
        belonged together. `overwrite.set` covers both creating and replacing an overwrite, because the
        endpoint is a `PUT` and does not distinguish them either — what changed is in `changes`.
      enum:
        - guild.create
        - guild.update
        - guild.delete
        - channel.create
        - channel.update
        - channel.delete
        - role.create
        - role.update
        - role.delete
        - role.reorder
        - member.update
        - member.remove
        - member.role_add
        - member.role_remove
        - overwrite.set
        - overwrite.delete

    AuditLogEntry:
      type: object
      required: [id, actor_id, action, target_id, changes, created_at]
      additionalProperties: false
      description: >
        One recorded mutation. Written in the same transaction as the change itself, so an entry cannot be
        missing for a mutation that committed.


        No `guild_id`: the route is guild-scoped, so it would repeat the path parameter, and the column is
        nullable in the schema for a case this endpoint can never return.
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        actor_id:
          $ref: "#/components/schemas/Snowflake"
        action:
          $ref: "#/components/schemas/AuditLogAction"
        target_id:
          oneOf:
            - $ref: "#/components/schemas/Snowflake"
            - type: "null"
          description: >
            What was acted on — a channel, role, member or guild depending on `action`. **Not resolved**,
            and often naming something that no longer exists, since deletions are half of what a log like
            this records. Null where the action names nothing in particular.
        changes:
          type: [object, "null"]
          additionalProperties: true
          description: >
            Per-action detail, or null where there is none. The shape depends on `action` and is
            deliberately not constrained here: a writer adding a field must not also be a change to the
            read path.


            Values can contain text a member chose — a guild, channel or role name. A client rendering
            this to a terminal must pass it through the terminal-safe sanitizer first, as it must for any
            other user-controlled string.
          example: { "name": "general" }
        created_at:
          type: string
          format: date-time

    Member:
      type: object
      required: [guild_id, user_id, nickname, joined_at, deaf, mute, roles]
      additionalProperties: false
      properties:
        guild_id:
          $ref: "#/components/schemas/Snowflake"
        user_id:
          $ref: "#/components/schemas/Snowflake"
        nickname:
          type: [string, "null"]
          description: A per-guild display name. Null means the account's own display name is used.
        joined_at:
          type: string
          format: date-time
        deaf:
          type: boolean
          description: >
            Server-side deafen, set by a moderator. Distinct from the self-deafen a client sets on itself,
            which lives in voice state.
        mute:
          type: boolean
          description: Server-side mute, set by a moderator. See `deaf`.
        roles:
          type: array
          description: >
            The roles this member holds, excluding `@everyone` — which every member holds and which appears
            in no grant. An empty array rather than null when there are none: a client that has to handle
            both writes the check once per field and forgets it somewhere.
          items:
            $ref: "#/components/schemas/Snowflake"

    UpdateMemberRequest:
      type: object
      additionalProperties: false
      description: >
        The permission required depends on which fields are present — see the endpoint description.
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 32
        clear_nickname:
          type: boolean
          default: false
          description: Removes the nickname. See `clear_description` on a guild for why this is a flag.
        deaf:
          type: boolean
        mute:
          type: boolean

    RegistrationChallenge:
      description: >
        **Reserved for M67a (registration anti-automation). Nothing produces one of these today.**


        The shape is reserved now rather than with the mechanism because rule 6 and rule 15 make it
        expensive once four clients generate from the current contract: adding a response state later is a
        coordinated regeneration across the CLI, the TUI, the GUI and the web SPA, where adding it now is
        three dozen lines nobody has to act on. The roadmap entry for M67a says the reservation lands with
        M12's contract work, and this is it.


        What is deliberately *not* fixed here is the mechanism. M67a chooses between proof-of-work, a
        hosted captcha, or both behind one interface at build time, and `parameters` is an open object so
        that choice does not become a contract change.
      type: object
      required: [mechanism, parameters]
      additionalProperties: false
      properties:
        mechanism:
          type: string
          description: >
            Which challenge this instance is asking for, so a client knows what to render or compute.


            Deliberately not an enum. An enum would make adding a mechanism a breaking regeneration for
            every client, which is the cost this whole reservation exists to avoid — and a client that does
            not recognise the value should tell the person to use a client that does, not fail closed on a
            list this document froze years earlier.
          examples: [proof_of_work, hcaptcha]
        parameters:
          type: object
          additionalProperties: true
          description: >
            Everything the client needs to produce a solution, in a shape the mechanism defines: a
            difficulty and a seed for proof-of-work, a site key for a hosted captcha.


            The one open object in this contract, and it is open on purpose rather than by omission —
            pinning it would tie the document to whichever mechanism was chosen first.
        expires_at:
          type: string
          format: date-time
          description: >
            When this challenge stops being accepted, so a client can offer a fresh one rather than submit
            a solution that will be refused. Optional: a stateless proof-of-work challenge need not expire.

    Error:
      description: >
        The envelope every non-2xx JSON response uses. Clients key off `code`, which is stable, never off
        `message`, which is human-readable and may change.
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error identifier.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - conflict
                - rate_limited
                - service_unavailable
                - internal_error
                # Still emitted by the OAuth sign-up path, which refuses outright on a gated instance —
                # there is nowhere to carry an invite code through a provider redirect. Registration's own
                # use of it ended at M10.
                - registration_closed
                - invite_required
                - invite_invalid
                - already_bootstrapped
                # The device-code grant's own vocabulary (RFC 8628 §3.5), from /auth/device/token. A
                # polling client branches on the first two every few seconds, so they are the codes here
                # that a generated client most needs to be able to name — and they were the ones missing
                # longest. Added after a manual run compared real responses against this enum; M9 shipped
                # them without this entry and nothing noticed, because the contract test walks the route
                # table and never a payload.
                - authorization_pending
                - slow_down
                - access_denied
                - expired_token
                # Configuration states, not faults. Each says a feature is switched off on this instance
                # rather than broken: no public base URL for the device flow, no mail relay for reset.
                - device_flow_unavailable
                - reset_unavailable
                # The OAuth paths, from M6.
                - oauth_email_unverified
                - oauth_provider_error
                # Reserved for M67a (registration anti-automation) and emitted by nothing today.
                #
                # Reserved rather than added later because a client generating a Go or TypeScript enum from
                # this list and switching on it needs regenerating when a value appears — which is a
                # coordinated change across four codegen'd clients for what should be an additive one. The
                # cost of reserving is these three lines; the cost of not reserving lands once every client
                # generates from the current shape (rules 6 and 15).
                #
                # `challenge_invalid` answers a submitted solution that does not verify. There is
                # deliberately no separate code for "expired" or "already used": those distinctions tell an
                # automated caller how close it got, which is the one audience this whole mechanism exists
                # to frustrate.
                - challenge_invalid
            message:
              type: string
              description: >
                Human-readable summary, safe to show a user.


                A 5xx message is generic — *except* where a handler has explicitly marked one as safe to
                send, which today is only the two `503`s above. Those say which feature is unconfigured,
                because "internal server error" would report an instance that is merely missing a setting
                as a broken one. What is never returned at any status is the underlying error: driver
                text, query fragments and hostnames are logged and stay there.
            request_id:
              type: string
              description: >
                Correlation ID for this request, matching the `X-Request-Id` response header and the
                server-side log line.

  responses:
    BadRequest:
      description: >
        The request body was malformed, exceeded 1 MiB, contained an unknown field, or failed validation.
        Unknown fields are rejected rather than ignored so a typo fails loudly instead of silently leaving
        a setting on its default (docs/architecture.md §14.1). Validation messages name the offending field
        and the rule it broke, never the submitted value — that value is a password on two of these routes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: >
        No such resource. Also the answer for a provider this instance has not configured, and for an
        object that exists but belongs to someone else — the two are deliberately indistinguishable, so
        the endpoint cannot be used to probe for what exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: >
        The caller is known and is inside the resource's scope, but lacks the permission the action needs.


        Distinct from `404` on purpose. A caller who is not a member of a guild gets 404 — the same answer
        a guild that does not exist gets — because guild ids are snowflakes and answering differently would
        turn a list of plausible ids into a map of what exists. A caller who *is* a member already knows
        the guild exists, so refusing them plainly discloses nothing.


        The message never names the missing permission bit. That would tell a caller probing the boundary
        exactly where it is, and a member can already read their own permissions from the role listing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: >
        No credential was presented, or the one presented was invalid, expired or revoked. An invalid
        credential is treated identically to an absent one, so a caller cannot distinguish "wrong token"
        from "no token".
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Always `Bearer realm="norite"`, per RFC 9110.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: >
        Too many requests. All IP-based limiting groups IPv6 traffic by /64 subnet rather than exact
        address (docs/architecture.md §11), so every address within one /64 shares a single budget.


        The unauthenticated `/auth/*` routes additionally sit behind a stricter bucket than the rest of the
        API, counted independently: they are credential-guessing surfaces, and throttling a stuffing run
        must not also throttle a legitimate client's ordinary requests.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the limit resets. Always present on a 429, and never `0`.
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp at which the current window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
