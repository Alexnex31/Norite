# Local dev + self-hosted docker-compose production option (docs/architecture.md §1, §8.16/M96).
#
# A RESP server is present from the start even though it stays reserved-but-unused by self-hosted
# single-process instances (docs/architecture.md §11) — only the flagship activates it. Having it here
# means the event bus and rate-limiter stores can be exercised later without a compose change.
#
# **It is Valkey rather than Redis, and the swap was forced rather than chosen.** `redis:7-alpine` is what
# this file pinned until M16, and the `7` tag has resolved to Redis 7.4 since July 2024 — which is
# RSALv2/SSPLv1 rather than BSD, and reaches end of life on 2026-11-30. Nobody changed a line; the floating
# tag walked from an open-source release to a source-available one on its own, which is the same drift that
# left the `golang:` image below a minor version behind the workspace directive until M14 caught it.
#
# Valkey is the Linux Foundation's BSD-3-Clause fork of Redis 7.2.4 and is drop-in here: identical RESP
# wire protocol, same RDB/AOF formats, and `redis/go-redis/v9` — what `ulule/limiter` uses — connects to it
# unchanged. Verified at M16 against 9.1.2: PING, PUBLISH, and the Lua INCR+EXPIRE the limiter does
# atomically all behave, and the server reports `redis_version:7.2.4` alongside `valkey_version:9.1.2` so
# version-gating clients stay happy.
#
# The seam keeps its name. `EVENTS_BACKEND=redis` and "the Redis-backed store" describe a protocol and a
# library's own vocabulary, not a vendor, and running actual Redis here remains valid — so renaming the
# config value would tie a seam to one product for no gain.
#
# **What the tags above are pinned to, and the rule behind it.** The lesson from `redis:7` is not "pin
# exactly" — it is *do not float across a range wide enough to change what the thing is*. `redis:7` floated
# across minors and crossed a licence change doing it. `postgres:16-alpine` and `valkey/valkey:9.1-alpine`
# float across patches only, which buys security fixes without that risk. `:latest` floats across
# everything, which is why mailpit is the one pinned to an exact version.
#
# Every published port is bound to 127.0.0.1 rather than the default 0.0.0.0. Docker's published ports are
# implemented as DNAT rules that bypass most host firewall configuration, so a bare "5432:5432" on a laptop
# means anyone on the same café or office Wi-Fi can reach this Postgres — which trusts the throwaway
# norite/norite credentials below. Nothing needs these ports off-box: containers reach each other over the
# compose network, and a developer reaches them from the same machine. If you deliberately want to hit the
# backend from another device (a phone, a second laptop), change that one line to "8080:8080" for as long
# as you need it, rather than dropping the loopback bind from all of them.
name: norite

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: norite
      POSTGRES_PASSWORD: norite
      POSTGRES_DB: norite
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Service name kept as `redis` deliberately: it is the hostname the backend resolves and what
    # `EVENTS_BACKEND=redis` names. See the header for why the image is Valkey.
    image: valkey/valkey:9.1-alpine
    ports:
      - "127.0.0.1:6379:6379"

  # A real SMTP server that accepts everything and delivers nothing, with a web UI for reading what it
  # caught. Without a relay in this stack, password reset (Milestone M5) cannot be exercised locally at
  # all — the backend refuses the request rather than sending into a void, which is correct behavior and
  # useless for development.
  #
  # Nothing here ever leaves the machine: Mailpit is the destination, not a forwarder.
  mailpit:
    # Pinned exactly, where postgres and valkey float within a line. `:latest` was the one tag here that
    # could become a different major version between two `just dev` runs, which is the opposite of what a
    # reproducible dev stack is for — and this file has now been bitten twice by tags moving underneath it
    # (the `golang:` image at M14, `redis:7` at M16). Bump deliberately; nothing here faces the network.
    image: axllent/mailpit:v1.31.1
    ports:
      # 1025 is SMTP, 8025 is the web UI — open http://localhost:8025 to read a reset email.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  backend:
    # Must track the workspace's `go` directive, which is 1.26.0. It did not, and `just dev` was broken
    # from the moment that directive was raised for an x/crypto advisory until M14's manual pass tried to
    # start the stack: the container refused to build with "go.mod requires go >= 1.26.0 (running go
    # 1.25.12; GOTOOLCHAIN=local)". Alpine images set GOTOOLCHAIN=local, so there is no automatic download
    # to paper over the mismatch — which is the right behaviour and the reason it failed loudly rather
    # than silently building against a different toolchain.
    image: golang:1.26-alpine
    working_dir: /app/backend
    volumes:
      # go.work is deliberately NOT mounted here: it lists cli/gui/daemon too, and Go auto-discovers any
      # go.work file in a parent directory, so mounting it without also mounting those sibling modules made
      # `go run` fail immediately (cannot load module ../cli/../daemon/../gui). backend doesn't import any
      # of them, so it doesn't need workspace mode at all inside the container — go.mod alone is enough.
      - ../backend:/app/backend
      # Named volumes for the module and build caches, so a restart doesn't re-download and re-compile
      # every dependency. Without these, `air`'s rebuild-on-save loop is unusably slow.
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      - gobin:/go/bin
    # air rebuilds and restarts the server on save. Installed at container start rather than baked into an
    # image because there is no backend Dockerfile yet — that arrives with the production container image
    # at Milestone M95/M96, and this service switches to it then.
    #
    # /go/bin is a named volume, so the install happens on first run and is reused after that; combined
    # with the module cache volume, later starts need no network.
    #
    # air is pinned to the newest release that still declares `go 1.25`; from v1.67.2 on it requires
    # go 1.26, which this image cannot satisfy and the golang images set GOTOOLCHAIN=local so Go will not
    # silently fetch another toolchain. When the image moves past 1.25, this pin can move with it — check
    # the release's go.mod, not whatever `go install` happens to do on the host.
    command:
      - sh
      - -c
      - |
        command -v air >/dev/null 2>&1 || go install github.com/air-verse/air@v1.67.1
        exec air -c .air.toml
    environment:
      NORITE_LISTEN_ADDR: ":8080"
      # postgres/redis resolve over the compose network; sslmode=disable is correct for that hop and
      # must not be copied into a real deployment.
      NORITE_DATABASE_URL: "postgres://norite:norite@postgres:5432/norite?sslmode=disable"
      NORITE_ENV: "development"
      NORITE_LOG_LEVEL: "debug"
      NORITE_LOG_FORMAT: "console"
      # Required since Milestone M4 — the backend refuses to start without one, and this stack could not
      # start at all between M4 and M5 because nothing set it here.
      #
      # A fixed, obviously-fake value on purpose: it is checked into a public repository, it must never
      # resemble a real key, and a value that changed per run would invalidate every access token on every
      # restart of a hot-reloading dev server.
      NORITE_JWT_SECRET: "dev-only-insecure-signing-key-do-not-use-anywhere-real"
      # Reset links are built from this. localhost rather than the container name, because the link is
      # opened in a browser on the host.
      NORITE_PUBLIC_BASE_URL: "http://localhost:8080"
      # Points at the mailpit service above. "none" is right for a hop that never leaves the compose
      # network; it is the wrong answer for anything else.
      NORITE_SMTP_ENABLED: "true"
      NORITE_SMTP_HOST: "mailpit"
      NORITE_SMTP_PORT: "1025"
      NORITE_SMTP_ENCRYPTION: "none"
      NORITE_SMTP_FROM_ADDRESS: "no-reply@norite.localhost"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Readiness only turns 200 once migrations have completed (docs/architecture.md §8.16), so this
      # doubles as the signal that the stack is actually usable.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  gomodcache:
  gobuildcache:
  gobin:
